<div id="app">
  <nav class="wtabs" id="wtabs" aria-label="Onglets"></nav>
  <nav class="fkeys" id="fkeys" aria-label="Touches et fonctions de marché"></nav>
  <header class="top">
    <i class="clm" aria-hidden="true"></i>
    <form class="cmd" id="cmdForm" autocomplete="off">
      <label for="cmd">Commande</label>
      <input id="cmd" spellcheck="false" autocapitalize="characters" placeholder="Ticker + fonction &lt;GO&gt; · ex. SNTS DES, AAPL GP, NEWS" aria-label="Ligne de commande">
      <button class="go" type="submit" title="Exécuter (Entrée)">GO</button>
      <div class="ac" id="ac" hidden></div>
    </form>
  </header>
  <div class="tbar" id="tbar"></div>
  <div class="sech" id="sech" hidden></div>
  <div class="rbar" id="rbar"></div>
  <nav class="ptabs" id="ptabs" hidden aria-label="Onglets"></nav>
  <main id="main"><div class="empty">Chargement des données…</div></main>
  <section class="nwp" id="nwp" aria-label="Dernières actualités"></section>
  <footer class="status" id="status"></footer>
</div>
<div class="ddm" id="ddm" hidden></div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
