name: Terminal

# Terminal FQT, actualisé toutes les 15 minutes, jour et nuit :
#   - séance BRVM (brvm.org), cours US (Nasdaq) et crypto (Coinbase), QQQ 5 min, actualités (flux RSS),
#     nouvelles publications des sociétés cotées (brvm.org) et nouveaux dépôts SEC (comptes rafraîchis aussitôt) ;
#   - tous les calculs refaits avec ces cours (ratios, Fear & Greed, cartes, corrélations, alertes...).
# Chaque soir (22:35 UTC) : base complète (BRVM depuis 2006, Nasdaq, FRED, CBOE, CNN, SEC, Banque mondiale, bulletins BRVM).
# Le site complet (index.html + data/) est écrit sur la branche `site`, que Vercel déploie à chaque écriture.
# Les données brutes (historiques Nasdaq, comptes SEC, bulletins...) vivent sur la branche `raw`.
on:
  schedule:
    - cron: "*/15 * * * *"         # toutes les 15 minutes
    - cron: "35 22 * * 1-5"        # EOD : base complète
  workflow_dispatch:
    inputs:
      mode:
        description: "live (relevé de 15 min) ou eod (base complète)"
        type: choice
        options: [eod, live]
        default: eod
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "build.py", "index.html", "vercel.site.json", ".github/workflows/terminal.yml"]

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        id: mode
        run: |
          MODE=live
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "35 22 * * 1-5" ]; then MODE=eod; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            # pages seulement : relevé normal ; scripts de collecte modifiés : base complète
            git fetch -q --depth 1 origin "${{ github.event.before }}" 2>/dev/null || true
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE '^(scripts/|\.github/)'; then MODE=eod; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode : $MODE"

      - name: Restaurer le site et les données brutes
        run: |
          mkdir -p /tmp/site /tmp/state /tmp/raw
          cp seed/brvm.json /tmp/state/brvm.json
          if git fetch -q --depth 1 origin site; then
            git archive FETCH_HEAD | tar -x -C /tmp/site || true
            if [ -f /tmp/site/data/session.json ]; then cp /tmp/site/data/session.json /tmp/state/brvm.json; fi
          fi
          mkdir -p /tmp/site/data
          if git fetch -q --depth 1 origin raw; then git archive FETCH_HEAD | tar -x -C /tmp/raw || true; fi
          rm -f /tmp/raw/.dirty

      - name: Cache des sources (miroirs CSV)
        uses: actions/cache@v4
        with:
          path: /tmp/bcache
          key: bcache-${{ github.run_id }}
          restore-keys: bcache-

      - name: Relever les cours (BRVM, QQQ, US, crypto)
        run: python3 scripts/scrape.py --mode "${{ steps.mode.outputs.mode }}" --state /tmp/state --out /tmp/site

      - name: Actualités, publications BRVM et dépôts SEC
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: timeout 300 python3 scripts/fetch_extra.py --out /tmp/raw --only watch --site /tmp/site/data --news /tmp/site/data/news.json

      - name: Outils PDF (EOD)
        if: steps.mode.outputs.mode == 'eod'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null || true

      - name: Sources complémentaires (FRED, CBOE, CNN, crypto, Banque mondiale, bulletins BRVM)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 900 python3 scripts/fetch_extra.py --out /tmp/raw --only fred,cboe,cnn,crypto,wb,probe,boc

      - name: Comptes SEC et consensus des analystes (EOD)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: timeout 1200 python3 scripts/fetch_extra.py --out /tmp/raw --only sec,analyst

      - name: Historiques Nasdaq (EOD, incrémental)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 1500 python3 scripts/fetch_extra.py --out /tmp/raw --only nasdaq

      - name: Recalculer toute la base
        run: |
          git clone -q --depth 1 https://github.com/harzat/brvm-data-public.git /tmp/brvmsrc
          LIVE=""; if [ "${{ steps.mode.outputs.mode }}" != "eod" ] && [ -f /tmp/site/data/summary.json ]; then LIVE="--live"; fi
          python3 scripts/build_terminal.py --brvm-src /tmp/brvmsrc --out /tmp/site/data --session /tmp/state/brvm.json \
            --extra /tmp/raw --fcf seed/fcf_brvm.json --quotes /tmp/site/data/quotes.json --cache /tmp/bcache $LIVE

      - name: "Publier les données brutes (branche raw, soir ou comptes SEC rafraîchis)"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/raw
          if [ "${{ steps.mode.outputs.mode }}" != "eod" ] && [ ! -f .dirty ]; then echo "Rien à publier"; exit 0; fi
          rm -f .dirty
          printf '{"git":{"deploymentEnabled":false}}\n' > vercel.json
          rm -rf .git
          git init -q -b raw
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Brut $(date -u +'%d/%m/%Y %H:%M') UTC" || exit 0
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" raw

      - name: Publier sur la branche site (déployée par Vercel)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          cp index.html /tmp/site/index.html
          touch /tmp/site/.nojekyll
          cp vercel.site.json /tmp/site/vercel.json
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export GIT_DIR=/tmp/pub.git GIT_WORK_TREE=/tmp/site
          rm -rf "$GIT_DIR" /tmp/site/.git
          git init -q -b site
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # relevé de 15 min : nouveau commit au-dessus du précédent (seuls les fichiers modifiés partent) ; soir : historique remis à zéro
          ONTOP=0
          if [ "$MODE" != "eod" ] && git fetch -q --depth 1 "$URL" site; then git reset -q FETCH_HEAD && ONTOP=1; fi
          git add -A
          git commit -qm "Données $(date -u +'%d/%m/%Y %H:%M') UTC" || { echo "Rien de nouveau"; exit 0; }
          if [ "$ONTOP" = 1 ]; then git push -q "$URL" HEAD:site || git push -q -f "$URL" HEAD:site; else git push -q -f "$URL" HEAD:site; fi

      - name: Archiver la séance BRVM sur main (EOD)
        if: steps.mode.outputs.mode == 'eod'
        run: |
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/brvm.json seed/brvm_daily.csv
          if git diff --cached --quiet; then echo "Rien à archiver"; else git commit -qm "séance BRVM $(date -u +%F)" && git pull -q --rebase origin main && git push -q origin HEAD:main; fi
