name: Terminal

# Terminal FQT : relève QQQ (Yahoo/Nasdaq), la séance BRVM (brvm.org) et les actualités toutes les 15 min,
# reconstruit toute la base chaque soir (BRVM depuis 2006, US, macro, FRED, Nasdaq, SEC, CBOE, CNN, Banque mondiale)
# et publie le site complet (index.html + data/) sur la branche site, réécrite à chaque passage.
# Les données brutes (séries Nasdaq, comptes SEC, bulletins BRVM...) vivent sur la branche raw.
# Heures UTC, lun-ven : BRVM 09:00-15:30, Nasdaq 13:30-20:00.
on:
  schedule:
    - cron: "*/15 9-20 * * 1-5"    # toutes les 15 min : séance BRVM (09:00-15:30 UTC) et séance US (13:30-20:00 UTC)
    - cron: "5 0-8,21-23 * * 1-5"  # hors séance : toutes les heures (actualités, crypto, cours après clôture)
    - cron: "5 * * * 0,6"          # week-end : toutes les heures (actualités, crypto)
    - cron: "35 22 * * 1-5"        # EOD : base complète
  workflow_dispatch:
    inputs:
      mode:
        description: "live (cours) ou eod (base complète)"
        type: choice
        options: [eod, live]
        default: eod
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "build.py", "index.html", "vercel.site.json", ".github/workflows/terminal.yml"]

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        id: mode
        run: |
          MODE=live
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "35 22 * * 1-5" ]; then MODE=eod; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            # code des pages seulement : republier la page ; scripts de collecte modifiés : base complète
            git fetch -q --depth 1 origin "${{ github.event.before }}" 2>/dev/null || true
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE '^(scripts/|\.github/)'; then MODE=eod; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode : $MODE"

      - name: Restaurer le site précédent (branche site)
        run: |
          mkdir -p /tmp/site /tmp/state /tmp/raw
          cp seed/brvm.json /tmp/state/brvm.json
          if git fetch -q --depth 1 origin site; then
            git archive FETCH_HEAD | tar -x -C /tmp/site || true
            if [ -f /tmp/site/data/session.json ]; then cp /tmp/site/data/session.json /tmp/state/brvm.json; fi
          fi
          mkdir -p /tmp/site/data

      - name: Restaurer les données brutes (branche raw, EOD)
        if: steps.mode.outputs.mode == 'eod'
        run: |
          if git fetch -q --depth 1 origin raw; then git archive FETCH_HEAD | tar -x -C /tmp/raw || true; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null || true

      - name: Relever les cours (QQQ + séance BRVM)
        run: python3 scripts/scrape.py --mode "${{ steps.mode.outputs.mode }}" --state /tmp/state --out /tmp/site

      - name: Actualités (flux RSS)
        continue-on-error: true
        run: timeout 120 python3 scripts/fetch_extra.py --out /tmp/newsraw --only "" --news /tmp/site/data/news.json

      - name: Sources complémentaires (FRED, CBOE, CNN, crypto, Banque mondiale, bulletins BRVM)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 900 python3 scripts/fetch_extra.py --out /tmp/raw --only fred,cboe,cnn,crypto,wb,boc,probe

      - name: Comptes SEC et consensus des analystes (EOD)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: timeout 1200 python3 scripts/fetch_extra.py --out /tmp/raw --only sec,analyst

      - name: Historiques Nasdaq (EOD, incrémental)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 1500 python3 scripts/fetch_extra.py --out /tmp/raw --only nasdaq

      - name: Reconstruire la base complète (EOD ou base absente)
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "eod" ] || [ ! -f /tmp/site/data/summary.json ]; then
            git clone -q --depth 1 https://github.com/harzat/brvm-data-public.git /tmp/brvmsrc
            python3 scripts/build_terminal.py --brvm-src /tmp/brvmsrc --out /tmp/site/data --session /tmp/state/brvm.json --extra /tmp/raw --fcf seed/fcf_brvm.json
          fi

      - name: Publier les données brutes (branche raw, EOD)
        if: steps.mode.outputs.mode == 'eod'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/raw
          printf '{"git":{"deploymentEnabled":false}}\n' > vercel.json
          rm -rf .git
          git init -q -b raw
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Brut $(date -u +'%d/%m/%Y %H:%M') UTC" || exit 0
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" raw

      - name: Publier sur la branche site (déployée par Vercel)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          cp index.html /tmp/site/index.html
          touch /tmp/site/.nojekyll
          cp vercel.site.json /tmp/site/vercel.json
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export GIT_DIR=/tmp/pub.git GIT_WORK_TREE=/tmp/site
          rm -rf "$GIT_DIR" /tmp/site/.git
          git init -q -b site
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # séance : nouveau commit au-dessus du précédent (seuls les fichiers modifiés sont envoyés) ; soir : historique remis à zéro
          ONTOP=0
          if [ "$MODE" != "eod" ] && git fetch -q --depth 1 "$URL" site; then git reset -q FETCH_HEAD && ONTOP=1; fi
          git add -A
          git commit -qm "Données $(date -u +'%d/%m/%Y %H:%M') UTC" || { echo "Rien de nouveau"; exit 0; }
          if [ "$ONTOP" = 1 ]; then git push -q "$URL" HEAD:site || git push -q -f "$URL" HEAD:site; else git push -q -f "$URL" HEAD:site; fi

      - name: Archiver la séance BRVM sur main (EOD)
        if: steps.mode.outputs.mode == 'eod'
        run: |
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/brvm.json seed/brvm_daily.csv
          if git diff --cached --quiet; then echo "Rien à archiver"; else git commit -qm "séance BRVM $(date -u +%F)" && git pull -q --rebase origin main && git push -q origin HEAD:main; fi
