:root{
  --bg:#000; --bg2:#0a0a0a; --bg3:#121212; --bg4:#1c1c1c;
  --line:#262626; --line2:#3a3a3a;
  --amber:#f9a33a; --amber2:#b86e10; --white:#f2f2f2; --txt:#dedede; --dim:#9a9a9a; --dim2:#5e5e5e;
  --up:#2fd26a; --dn:#ff3d4d; --navy:#0e2148; --navy2:#173a78; --red:#a8101f; --red2:#c8182b; --yel:#ffd200;
  --cyan:#5fd0ea; --violet:#b69cff; --pink:#ff7ab2; --teal:#3fd3c0;
  --org:#ff9e2b; --tab:#464646; --tabon:#b3b3b3; --sel:#275a8f; --sel2:#2159a3; --hdr:#2d2d2d; --lab:#1c1c1c;
  --news:#011230; --news2:#001941; --tbar:#1b1b1b;
  --mono:"Bloomberg Fixed Unicode B","Bloomberg Fixed Unicode","FQT Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --ui:var(--mono); --num:var(--mono);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100%}
body{margin:0;color:var(--txt);font:400 12.5px/1.35 var(--mono)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cyan)}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--yel);outline-offset:0}
.n{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--dim)} .am{color:var(--amber)} .wh{color:var(--white)} .dm{color:var(--dim)}

/* ---------- ligne de commande ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:stretch;background:#000;height:28px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid #0b2236}
.clm{width:10px;background:linear-gradient(135deg,#0d6fa0 0 50%,transparent 50%);flex:none}
.cmd{flex:1;display:flex;align-items:center;position:relative;min-width:0;background:#000;border:1px solid #13324d;margin:2px 4px 2px 2px}
.cmd label{display:none}
.cmd input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--white);font:400 14px var(--mono);text-transform:uppercase;letter-spacing:.02em;height:100%;padding:0 4px 0 2px;caret-color:#10bbff}
.cmd input::placeholder{color:#4d6478;text-transform:none;font-size:12px}
.cmd:before{content:'';width:9px;height:16px;background:#10bbff;margin-left:3px;flex:none}
.cmd:focus-within:before{display:none}
.go{background:#3aba5d;color:#000;border:0;font:700 11.5px var(--mono);padding:0 12px;margin:2px;letter-spacing:.04em}
.go:hover{background:#4fd673}
.ac{position:absolute;left:-1px;right:-1px;top:100%;background:#000;border:1px solid #13324d;border-top:0;max-height:min(70vh,560px);overflow:auto;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.ac div{display:grid;grid-template-columns:150px 1fr 104px;gap:10px;padding:3px 8px;cursor:pointer;font-size:12.5px;align-items:baseline}
.ac div b{color:var(--white);font-weight:700}
.ac div span{color:var(--amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac div span i{font-style:normal;color:var(--dim)}
.ac div span:last-child{color:var(--dim);text-align:right;font-size:11.5px}
.ac div.on,.ac div:hover{background:var(--sel)}
.ac div.on span,.ac div:hover span{color:#fff}
.ac div.off b,.ac div.off span{color:var(--dim2)}
.ac .ach{display:block;margin:0;padding:2px 8px;background:var(--hdr);color:#fff;font-size:11.5px;cursor:default}
.ac .hint{margin:0;padding:4px 8px;color:var(--dim);font-size:11px;border-top:1px solid var(--line2)}

/* ---------- barre d'outils (◀ ▶, titre, fonction, fonctions associées) ---------- */
.tbar{display:flex;align-items:center;gap:4px;background:var(--tbar);padding:2px 6px;min-height:24px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #000}
.tbar::-webkit-scrollbar{display:none}
.tbar .nv{background:none;border:0;color:#ddd;font-size:13px;padding:0 4px;line-height:20px}
.tbar .nv:disabled{color:#555;cursor:default}
.tbar .dd{display:inline-flex;align-items:center;gap:6px;background:#d9d9d9;color:#000;border:0;padding:0 4px 0 6px;height:19px;font-size:12px;max-width:300px}
.tbar .dd span{overflow:hidden;text-overflow:ellipsis}
.tbar .dd:after{content:'▾';font-size:11px;color:#333}
.tbar .dd:hover{background:#fff}
.tbar .sp{flex:1}
.clocks{display:flex;align-items:center;gap:12px;padding:0 6px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.clocks b{color:var(--white);font-weight:400}
.feed{display:flex;align-items:center;gap:6px;padding:0 4px;font-size:11px;white-space:nowrap;color:var(--dim)}
.feed i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.feed.live i{background:var(--up)}
.feed button{background:var(--sel);border:0;color:#fff;font-size:11px;padding:1px 7px}

/* ---------- fonctions de marché ---------- */
.fkeys{display:flex;gap:1px;background:#000;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #000}
.fkeys::-webkit-scrollbar{display:none}
.fk{background:#262626;border:0;padding:3px 8px 2px;color:#e6e6e6;font-size:12px;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.fk em{display:none}
.fk b{color:var(--white);font-weight:700}
.fk span{color:var(--dim);font-size:11px}
.fk:hover{background:#3a3a3a}
.fk.on{background:var(--sel)}
.fk.on span{color:#cfe0f5}

/* ---------- en-tête du titre (2 lignes) ---------- */
.sech{background:#000;padding:2px 8px 1px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;line-height:1.25}
.sech::-webkit-scrollbar{display:none}
.sech .l1,.sech .l2{display:flex;align-items:baseline;gap:14px}
.sech .l1{font-size:17px}
.sech .l2{font-size:13.5px}
.sech .mk{display:inline-block;width:9px;height:15px;background:#1e6ea0;margin-right:-6px;align-self:center}
.sech .tk{color:#fff;font-weight:400}
.sech .cu{color:var(--dim)}
.sech .p{font-weight:400}
.sech .lb{color:var(--amber)}
.sech .vl{color:var(--white)}
.sech .ex{color:var(--dim);font-size:12px}
.sech .xt{font-size:13px;color:var(--white)}
.sech .xt .lb{margin-right:6px}
.sech .bars{display:inline-block;width:14px;height:8px;background:repeating-linear-gradient(90deg,#c87d10 0 2px,transparent 2px 4px);align-self:center;margin-right:-6px;opacity:.8}
.sech svg{align-self:center}

/* ---------- barre rouge d'action ---------- */
.rbar{display:flex;align-items:stretch;background:var(--red);min-height:22px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;border-top:1px solid #000}
.rbar::-webkit-scrollbar{display:none}
.rbar .ob{flex:none;background:var(--org);color:#000;padding:0 10px;display:flex;align-items:center;font-size:14px;min-width:190px}
.rbar .rt{margin-left:auto;color:#fff;font-size:14px;display:flex;align-items:center;padding:0 10px}
.rbar .ab{flex:none;background:var(--red);border:0;border-left:1px solid #6e0a12;border-right:1px solid #c5303c;color:#fff;font-size:13.5px;padding:0 14px;display:flex;align-items:center;gap:6px}
.rbar .ab em{font-style:normal;font-size:12px}
.rbar .ab.mn:after{content:'▾';font-size:11px}
.rbar .ab:hover{background:var(--red2)}
.rbar .ret{color:#fff;padding:0 10px;display:flex;align-items:center;font-size:13px}

/* ---------- onglets numérotés ---------- */
.ptabs{display:flex;gap:0;background:#000;padding:2px 2px 0;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--tabon)}
.ptabs::-webkit-scrollbar{display:none}
.ptab{position:relative;background:var(--tab);color:#fff;border:0;font-size:13px;padding:1px 18px 0 8px;margin-right:2px;white-space:nowrap;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 100%,0 100%);line-height:19px}
.ptab em{font-style:normal;font-size:12px;margin-right:2px}
.ptab:hover{background:#5a5a5a}
.ptab.on{background:var(--tabon);color:#000}
.ptab.off{color:#777}
.stabs2{display:flex;gap:1px;background:#9e9e9e;padding:1px;flex-wrap:wrap}
.stab{background:transparent;border:0;color:#000;font-size:12.5px;padding:0 10px;line-height:19px;white-space:nowrap}
.stab em{font-style:normal;font-size:11.5px}
.stab:hover{background:#bdbdbd}
.stab.on{background:var(--sel2);color:#fff}

/* ---------- pages ---------- */
main{flex:1;padding:4px;display:grid;gap:4px;align-content:start;min-width:0}
.grid{display:grid;gap:4px;min-width:0}
.c2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.c2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.side{grid-template-columns:minmax(0,1fr) 370px}
.bt{grid-template-columns:minmax(0,320px) minmax(0,1fr)}
.pn{background:#000;border:1px solid #1f1f1f;display:flex;flex-direction:column;min-width:0;position:relative}
.pt{display:flex;align-items:center;gap:8px;background:#333639;color:#fff;padding:1px 6px;font:400 12.5px var(--mono);min-height:20px;white-space:nowrap;overflow:hidden}
.pt .code{margin-left:auto;color:#fff;font-size:12px;cursor:pointer}
.pt .code:after{content:' »'}
.pt .code:empty:after{content:''}
.pt .sel{color:#b9c0c8;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.pb{padding:5px 7px;min-width:0;position:relative;overflow-x:auto}
.pb.np{padding:0}
.lect{border-top:1px solid var(--line);padding:4px 7px 5px;color:#a9a9a9;font-size:11.5px;line-height:1.45}
.lect b{color:var(--amber);font-weight:400}
.lect strong{color:var(--white);font-weight:400}
.cv{position:relative;width:100%}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{display:flex;flex-wrap:wrap;gap:2px;padding:3px 4px;background:#000;align-items:center;border-bottom:1px solid #1f1f1f}

  if (o.cx != null) { x.strokeStyle = CL.dim; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(X(o.cx) + .5, padT); x.lineTo(X(o.cx) + .5, padT + H); x.stroke(); x.setLineDash([]); }

  for (const p of P) if (p.trail && p.trail.length) { const tr = p.trail.concat([[p.x, p.y]]); for (let i = 1; i < tr.length; i++) { x.strokeStyle = rgba(p.color || CL.cyan, .15 + .7 * i / tr.length); x.lineWidth = 1.5; x.beginPath(); x.moveTo(X(tr[i - 1][0]), Y(tr[i - 1][1])); x.lineTo(X(tr[i][0]), Y(tr[i][1])); x.stroke(); }

function lastCross(c, s) { const n = c.length; const above = c[n - 1] > s[n - 1]; let k = n - 1; while (k > 0 && isFinite(s[k - 1]) && (c[k - 1] > s[k - 1]) === above) k--; return { above, k }; }

  const sk = [...sM.keys()].sort((a, b) => a - b), crises = []; { let pk = -1, pkk = null, tr = 1e18, trk = null, inDD = false;

/* ------------------------------------------------------------------ CORR (BRVM × monde, paire au choix, valeur de référence) */
function weeklyReturns(W) {
  if (W._R) return W._R; const R = {};
  for (const [id, col] of Object.entries(W.s)) R[id] = col.map((v, i) => i && v != null && col[i - 1] != null && col[i - 1] > 0 && v > 0 ? Math.log(v / col[i - 1]) : null);
  return (W._R = R);
}
/* Corrélation de deux séries de rendements ; lag = 1 ajoute les covariances décalées d'une semaine (correction de Dimson pour cotations non synchrones). */
function corrPair(x, y, a, b, lag) {
  const m = (u, v, s) => { let sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, k = 0; for (let t = Math.max(a, 1); t < b; t++) { const p = u[t], q = v[t + s]; if (p == null || q == null) continue; sx += p; sy += q; sxx += p * p; syy += q * q; sxy += p * q; k++; }
    return k ? { cv: sxy / k - sx * sy / k / k, vx: sxx / k - sx * sx / k / k, vy: syy / k - sy * sy / k / k, k, mx: sx / k, my: sy / k } : null; };
  const z = m(x, y, 0); if (!z || z.k < Math.max(20, (b - a) * .45) || z.vx <= 0 || z.vy <= 0) return null;
  let cv = z.cv; if (lag) { const l1 = m(x, y, -1), l2 = m(x, y, 1); cv += (l1 ? l1.cv : 0) + (l2 ? l2.cv : 0); }
  return { r: U.clamp(cv / Math.sqrt(z.vx * z.vy), -1, 1), beta: cv / z.vy, n: z.k, alpha: z.mx - (cv / z.vy) * z.my };
}
PAGES.CORR = async (m, alive) => {
  const W = await getJSON('weekly.json'); if (!alive()) return; const cs = ST.corr, T = W.w.length, R = weeklyReturns(W), has = id => !!W.s[id];
  if (!['BRVMW', 'BRVM', 'MIX', 'US', 'REF'].includes(cs.u)) cs.u = 'BRVMW'; cs.ord = cs.ord || 'grp';
  const main = ['BRVMC', 'BRVM30', 'BRVMPR', 'BRVMPA'].filter(has);
  const bIdx = main.concat(secsWhere(s => s.mkt === 'BRVM' && s.cls === 'Index' && !main.includes(s.id) && has(s.id) && !/ancien/i.test(s.n || '')).map(s => s.id));
  const bStk = secsWhere(s => s.mkt === 'BRVM' && s.cls === 'Equity' && has(s.id)).sort((p, q) => (q.mcap || 0) - (p.mcap || 0)).map(s => s.id);
  const world = ['SPY', 'QQQ', 'VTI', 'IWM', 'EFA', 'EEM', 'AFK', 'EZA', 'NGE', 'FXI', 'INDA', 'EWZ', 'GLD', 'SLV', 'BRENT', 'WTI', 'NATGAS', 'DBA', 'CPER', 'TLT', 'HYG', 'UUP', 'EURUSD', 'USDXOF', 'VIX', 'BTC', 'SOXX', 'NVDA', '0050'].filter(has);
  const usU = secsWhere(s => (s.mkt === 'US' || s.mkt === 'TW') && has(s.id) && (s.typ === 'Equity' || ['QQQ', 'VTI', 'SPY', 'SOXX', '0050'].includes(s.id))).map(s => s.id).slice(0, 80);
  const mix = ['QQQ', 'SPY', 'VTI', 'EFA', 'EEM', 'AFK', 'SOXX', 'NVDA', 'TSM', '0050', 'BRVMC', 'BRVM30', 'SNTS', 'ORAC', 'SGBC', 'GLD', 'BRENT', 'WTI', 'NATGAS', 'TLT', 'HYG', 'VIX', 'EURUSD', 'USDXOF', 'BTC'].filter(has);
  const a = Math.max(1, T - cs.win), b = T, lag = !!cs.lag;
  const sqr = cs.u === 'BRVM' ? bIdx.concat(bStk) : cs.u === 'MIX' ? mix : cs.u === 'US' ? usU : null;
  const rows = cs.u === 'BRVMW' ? bIdx.concat(bStk) : sqr, cols = cs.u === 'BRVMW' ? world : sqr;
  const allIds = Object.keys(W.s).filter(id => Q.by[id]).sort();
  const pick = (id, def) => has(id) ? id : def;
  cs.ref = pick(cs.ref, 'BRVMC'); let pair = cs.pair && has(cs.pair[0]) && has(cs.pair[1]) ? cs.pair : null;
  const flat = id => { const r = R[id]; let z = 0, k = 0; for (let t = a; t < b; t++) if (r[t] != null) { k++; if (r[t] === 0) z++; } return k ? z / k : 1; };
  const nm = id => { const s = Q.by[id]; return s ? esc(s.short || s.n || id) : id; };
  const tools = `<span class="tlab">Univers</span>${[['BRVMW', 'BRVM × monde'], ['BRVM', 'BRVM (indices + 48 actions)'], ['MIX', 'Multi-actifs'], ['US', 'États-Unis & Taïwan'], ['REF', 'Une valeur face à tout']].map(([k, l]) => `<button class="tb ${cs.u === k ? 'on' : ''}" data-cu="${k}">${l}</button>`).join('')}
    <span class="tlab">Fenêtre</span>${[[52, '1 an'], [104, '2 ans'], [260, '5 ans'], [520, '10 ans']].map(([k, l]) => `<button class="tb ${cs.win === k ? 'on' : ''}" data-cw="${k}">${l}</button>`).join('')}
    <button class="tb ${lag ? 'on' : ''}" data-lag="1" title="Ajoute les covariances décalées d'une semaine : corrige le retard de cotation des titres peu liquides">Correction Dimson</button>
    ${sqr ? `<span class="tlab">Tri</span><button class="tb ${cs.ord === 'grp' ? 'on' : ''}" data-co="grp">${cs.u === 'BRVM' ? 'Indices puis actions' : 'Liste'}</button><button class="tb ${cs.ord === 'pc1' ? 'on' : ''}" data-co="pc1">1re composante</button>` : ''}`;
  let body = '', lectM = '', afterPca = null;
  if (cs.u === 'REF') {
    const x = R[cs.ref]; const res = allIds.filter(id => id !== cs.ref).map(id => { const c = corrPair(x, R[id], a, b, lag), c5 = corrPair(x, R[id], Math.max(1, T - 260), T, lag); return c ? { id, c, c5, fl: flat(id) } : null; }).filter(Boolean).sort((p, q) => q.c.r - p.c.r);
    if (!pair) pair = [cs.ref, res[0] ? res[0].id : 'QQQ'];
    body = `<form class="pairf" id="crF"><span class="tlab">Valeur de référence</span><input list="cpL" id="cr1" value="${esc(cs.ref)}" spellcheck="false"><button class="tb">Calculer</button></form>
      <div class="tw" style="max-height:66vh"><table class="t" id="cRT"><thead><tr><th class="l">Titre</th><th class="l">Nom</th><th class="l">Marché</th><th>Corrélation</th><th style="width:140px"></th><th>Corr. 5 ans</th><th>Bêta</th><th>Semaines</th><th>Sans variation</th></tr></thead><tbody>
      ${res.map(r => { const s = Q.by[r.id], w = Math.abs(r.c.r) * 60; return `<tr data-p="${cs.ref}|${r.id}" style="cursor:pointer"><td class="l tk">${r.id}</td><td class="l nm">${nm(r.id)}</td><td class="l dm">${s ? s.mkt : ''}</td><td class="${r.c.r > 0 ? 'up' : 'dn'}">${num(r.c.r, 2)}</td>
        <td><div class="zbar"><i style="${r.c.r >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`};background:${r.c.r >= 0 ? 'var(--up)' : 'var(--dn)'}"></i></div></td><td>${r.c5 ? num(r.c5.r, 2) : '—'}</td><td>${num(r.c.beta, 2)}</td><td>${r.c.n}</td><td class="${r.fl > .4 ? 'dn' : 'dm'}">${num(r.fl * 100, 0)} %</td></tr>`; }).join('')}</tbody></table></div>`;
    lectM = `Corrélation des rendements hebdomadaires de <b>${cs.ref}</b> (${nm(cs.ref)}) avec chacun des ${res.length} autres actifs, du plus lié au plus opposé. Bêta = sensibilité de l’actif aux mouvements de ${cs.ref}. « Sans variation » = part des semaines où le cours n’a pas bougé : au-delà de 40 %, la corrélation est sous-estimée (titre peu échangé) — activez la correction Dimson.`;
  } else {
    let rr = rows.slice(), cc = cols.slice(); const C = rr.map(p => cc.map(q => p === q ? { r: 1 } : corrPair(R[p], R[q], a, b, lag)));
    if (sqr && cs.ord === 'pc1') { const Cf = C.map(r => r.map(v => v ? v.r : 0)); const E = eigTop(Cf, 1); const sg = Math.sign(E.vecs[0].reduce((x, y) => x + y, 0)) || 1; const o = rr.map((id, i) => [i, E.vecs[0][i] * sg]).sort((p, q) => q[1] - p[1]).map(x => x[0]); rr = o.map(i => rr[i]); cc = rr.slice(); }
    const CC = rr.map(p => cc.map(q => { if (p === q) return { r: 1 }; const i = rows.indexOf(p), j = cols.indexOf(q); return C[i][j]; }));
    if (!pair) pair = [rr[0], cc.find(id => id !== rr[0] && id !== 'USDXOF') || cc[0]];
    const isIdx = id => Q.by[id] && Q.by[id].cls === 'Index' && Q.by[id].mkt === 'BRVM';
    body = `<div class="tw" style="max-height:70vh"><table class="t hm" id="cT"><thead><tr><th class="l">Titre</th>${cs.u === 'BRVMW' ? '<th class="l">Nom</th>' : ''}${cc.map(id => `<th class="vh" title="${nm(id)}">${id}</th>`).join('')}${cs.u === 'BRVMW' ? '<th>Moy.</th>' : ''}</tr></thead><tbody>
      ${rr.map((p, i) => { const vals = CC[i].filter((v, j) => v && cc[j] !== p).map(v => v.r); const fl = flat(p);
        return `<tr class="${isIdx(p) && !isIdx(rr[i + 1]) ? 'sep' : ''}"><td class="l tk ${isIdx(p) ? 'am' : ''}" data-sec="${p}" data-to="GP" style="cursor:pointer" title="${nm(p)}${fl > .4 ? ' — ' + num(fl * 100, 0) + ' % de semaines sans variation' : ''}">${p}${fl > .4 ? '<sup>*</sup>' : ''}</td>${cs.u === 'BRVMW' ? `<td class="l nm" style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${nm(p)}</td>` : ''}
        ${CC[i].map((v, j) => `<td data-p="${p}|${cc[j]}" style="cursor:pointer;background:${p === cc[j] ? '#222' : heatBg(v ? v.r : null, 1)};color:${v && Math.abs(v.r) > .6 ? '#fff' : 'var(--txt)'}">${p === cc[j] ? '' : v ? num(v.r, 2).replace('0,', ',') : '·'}</td>`).join('')}
        ${cs.u === 'BRVMW' ? `<td class="wh">${vals.length ? num(U.mean(vals), 2) : '—'}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
    const all = []; CC.forEach((r, i) => r.forEach((v, j) => { if (v && rr[i] !== cc[j]) all.push(v.r); }));
    lectM = `${cs.u === 'BRVMW' ? `Lignes : les indices BRVM puis les ${bStk.length} actions (par capitalisation). Colonnes : marchés mondiaux.` : `${rr.length} actifs.`} Corrélation des rendements hebdomadaires sur la fenêtre ; <b>vert</b> = mouvements communs, <b>rouge</b> = opposés. Moyenne : <strong>${num(U.mean(all), 2)}</strong>. <sup>*</sup> = titre sans variation plus de 40 % des semaines (corrélation sous-estimée). Cliquer une case pour étudier la paire.`;

  }

<script>
/* ================= FQT — quant appliqué à la BRVM (et aux actions US) : SCOR, LQA, TRA, ANOM, MODL, PEER ================= */
'use strict';
/* univers de comparaison : les 47-48 actions BRVM, ou les actions US dont les comptes SEC sont disponibles */
function uniOf(s) { return isBRVM(s) ? secsWhere(x => x.mkt === 'BRVM' && x.cls === 'Equity' && !legacy(x)) : secsWhere(x => x.mkt === 'US' && x.cls === 'Equity' && x.typ !== 'ETF' && x.fa); }
function prank(arr, v, dir = 1) { if (v == null || !isFinite(v)) return null; const a = arr.filter(x => x != null && isFinite(x)); if (a.length < 4) return null; let lt = 0, eq = 0; for (const x of a) { if (x < v) lt++; else if (x === v) eq++; } const p = (lt + .5 * eq) / a.length * 100; return dir > 0 ? p : 100 - p; }
const medA = a => { const v = a.filter(x => x != null && isFinite(x)).sort((p, q) => p - q); return v.length ? v[Math.floor(v.length / 2)] : null; };
const lsGet = (k, d) => { try { const v = localStorage.getItem('fqt.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('fqt.' + k, JSON.stringify(v)); } catch (e) { } };
const fmtM = (t, v) => v == null || !isFinite(v) ? null : t === 'pct' ? num(v * 100, 1) + '%' : t === 'x' ? num(v, 2) + 'x' : t === 'int' ? num(v, 0) : num(v, 2);
const scoreCol = v => v == null ? '#1a1a1a' : `hsl(${Math.round(v * 1.2)},70%,${22 + Math.abs(v - 50) / 50 * 10}%)`;

/* ------------------------------------------------------------------ SCOR : score multifactoriel /100
   Chaque mesure est classée en centile dans l'univers (banques comparées aux banques pour la valorisation et la qualité) ;
   un facteur = moyenne des centiles disponibles ; le score = moyenne pondérée des facteurs (poids modifiables). */
const SC_F = [
  ['V', 'Value', [['ey', 'Rendement bénéficiaire (1/PER)', 1, 'pct', 'peer'], ['pb', 'Cours / actif net (P/B)', -1, 'x', 'peer'], ['fcfy', 'Rendement du free cash-flow', 1, 'pct', 'peer', 'corp']]],
  ['Q', 'Qualité', [['roe', 'ROE', 1, 'pct', 'peer'], ['roic', 'ROIC', 1, 'pct', 'peer', 'corp'], ['nm', 'Marge nette', 1, 'pct', 'peer'], ['om', 'Marge d’exploitation', 1, 'pct', 'peer', 'corp'], ['nd_ebitda', 'Dette nette / EBITDA', -1, 'x', 'peer', 'corp'], ['ni_cv', 'Instabilité du résultat (CV 5-6 ans)', -1, 'num', 'peer'], ['ni_dec', 'Années de baisse du résultat', -1, 'int', 'peer']]],
  ['G', 'Croissance', [['rev_cagr3', 'CA, TCAM 3 ans', 1, 'pct', 'peer'], ['eps_cagr3', 'BPA, TCAM 3 ans', 1, 'pct', 'peer'], ['rev_g', 'CA, 1 an', 1, 'pct', 'peer'], ['ni_g', 'Résultat net, 1 an', 1, 'pct', 'peer']]],
  ['M', 'Momentum', [['r3m', 'Performance 3 mois', 1, 'pct', 'all'], ['r6m', 'Performance 6 mois', 1, 'pct', 'all'], ['r1y', 'Performance 12 mois', 1, 'pct', 'all']]],
  ['Y', 'Rendement', [['dy', 'Rendement du dividende', 1, 'pct', 'all'], ['div_n10', 'Années avec dividende (10 ans)', 1, 'int', 'all'], ['div_cut', 'Baisses de dividende (10 ans)', -1, 'int', 'all']]],
  ['L', 'Faible volatilité', [['vol', 'Volatilité 1 an', -1, 'pct', 'all'], ['beta', 'Bêta', -1, 'num', 'all']]]];
const SC_W0 = { V: 1, Q: 1, G: 1, M: 1, Y: 1, L: 1 };
async function scoreUniverse(s) {
  const IDX = await getJSON('fa_index.json'); const U0 = uniOf(s), byFa = new Map(IDX.rows.map(r => [r.id, r]));
  const rows = U0.map(x => { const r = byFa.get(x.id) || {}; return { id: x.id, s: x, bank: !!(x.bank || r.bank), grp: x.grp, ey: r.ey != null ? r.ey : r.pe ? 1 / r.pe : null, pb: r.pb > 0 ? r.pb : null, fcfy: r.fcfy, roe: r.roe, roic: r.roic, nm: r.nm, om: r.om,
    nd_ebitda: r.nd_ebitda, ni_cv: r.ni_cv, ni_dec: r.ni_dec, rev_cagr3: r.rev_cagr3, eps_cagr3: r.eps_cagr3, rev_g: r.rev_g, ni_g: r.ni_g, r3m: x.r3m, r6m: x.r6m, r1y: x.r1y, dy: r.dy != null ? r.dy : x.yld, div_n10: r.div_n10, div_cut: r.div_cut,
    vol: x.vol, beta: x.beta, hasFa: byFa.has(x.id) }; });
  const W = lsGet('scorW', SC_W0);
  for (const r of rows) { r.f = {}; r.m = {};
    for (const [fk, , ms] of SC_F) { const ps = [];
      for (const [k, , dir, , scope, only] of ms) { if (only === 'corp' && r.bank) continue; const peers = scope === 'peer' && isBRVM(s) ? rows.filter(q => q.bank === r.bank) : rows;
        const p = prank(peers.map(q => q[k]), r[k], dir); r.m[k] = p; if (p != null) ps.push(p); }
      r.f[fk] = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null; }
    let sw = 0, sv = 0; for (const [fk] of SC_F) if (r.f[fk] != null && W[fk] > 0) { sw += W[fk]; sv += W[fk] * r.f[fk]; } r.total = sw ? sv / sw : null; r.nf = SC_F.filter(([fk]) => r.f[fk] != null).length; }

}
PAGES.SCOR = async (m, alive) => {
  const s = sec(ST.sec); const tab = tabState('SCOR', 's'); setTabs([['s', 'Score du titre'], ['c', 'Classement'], ['w', 'Pondérations et méthode']], tab, k => { ST.tab.SCOR = k; render(); });

    const cell = v => `<td style="background:${scoreCol(v)};color:#fff">${v == null ? '—' : num(v, 0)}</td>`;
    m.innerHTML = pn(`Score multifactoriel · ${U0} · ${N} titres classés`, 'SCOR', `<div class="tw" style="max-height:70vh"><table class="t"><thead><tr><th class="l">Rang</th><th class="l">Titre</th><th class="l">Société</th><th class="l">Secteur</th><th data-k="total" class="${st.k === 'total' ? 'on' : ''}">Score</th>${SC_F.map(([fk, l]) => `<th data-k="${fk}" class="${st.k === fk ? 'on' : ''}">${l}</th>`).join('')}<th>Facteurs</th></tr></thead><tbody>
      ${rows.map(r => `<tr data-sec="${r.id}" data-to="SCOR" class="${r.id === s.id ? 'cur' : ''}"><td class="l">${r.rank || '—'}</td><td class="l tk">${r.id}</td><td class="l nm">${esc(r.s.short || r.s.n)}</td><td class="l dm">${esc(r.grp || '')}${r.bank ? ' (banque)' : ''}</td>${cell(r.total)}${SC_F.map(([fk]) => cell(r.f[fk])).join('')}<td class="dm">${r.nf}/6</td></tr>`).join('')}</tbody></table></div>`,
      { np: true, lect: 'Centiles dans l’univers (0 = le plus faible, 100 = le meilleur) ; pour la BRVM, valorisation, qualité et croissance des banques sont comparées aux seules banques. Cliquer un en-tête trie, une ligne ouvre le score du titre. Score calculé, pas un conseil.' });
    m.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { st.k = th.dataset.k; render(); });
    return;
  }
  if (tab === 'w') {
    const W = SU.W;
    m.innerHTML = `<div class="grid c2">${pn('Pondération des facteurs', 'SCOR', `<div class="form">${SC_F.map(([fk, l]) => `<label>${l}<input type="number" min="0" max="5" step=".5" data-w="${fk}" value="${W[fk]}"></label>`).join('')}<button class="run" id="scW">Appliquer</button><button class="tb" id="scW0" style="grid-column:1/-1">Revenir à des poids égaux</button></div>`, { lect: 'Poids relatifs (0 = facteur ignoré). Enregistrés dans ce navigateur.' })}
      ${pn('Méthode', 'SCOR', `<div class="lectb">${SC_F.map(([fk, l, ms]) => `<p><b>${l}</b> : ${ms.map(([, ml, dir, , scope, only]) => `${ml} (${dir > 0 ? 'plus haut = mieux' : 'plus bas = mieux'}${scope === 'peer' ? ', comparé au groupe banques / hors banques' : ''}${only === 'corp' ? ', hors banques' : ''})`).join(' ; ')}.</p>`).join('')}
        <p>Chaque mesure est convertie en centile (0-100) dans l’univers ${U0}. Une mesure absente n’est pas remplacée : le facteur est la moyenne des mesures disponibles, et un facteur sans aucune mesure est exclu du score. Le nombre de facteurs disponibles est indiqué.</p>
        <p><b>Sources</b> : comptes (SikaFinance, états financiers BRVM, SEC EDGAR), cours et dividendes (brvm.org, Nasdaq). Les ratios sont calculés sur le dernier exercice publié.</p></div>`)}</div>`;
    $('scW').onclick = () => { const w = {}; m.querySelectorAll('[data-w]').forEach(i => w[i.dataset.w] = Math.max(0, +i.value || 0)); lsSet('scorW', w); toast('Pondérations enregistrées.'); render(); };
    $('scW0').onclick = () => { lsSet('scorW', SC_W0); render(); };
    return;
  }
  if (!me || me.total == null) { m.innerHTML = pn(`${esc(s.tk)} · score`, 'SCOR', '<div class="empty">Pas assez de données pour noter ce titre.</div>'); return; }
  const fac = SC_F.map(([fk, l, ms]) => ({ fk, l, v: me.f[fk], med: medA(SU.rows.map(r => r.f[fk])), ms }));
  const detail = SC_F.map(([fk, l, ms]) => `<tr class="sec"><td class="l" colspan="5">${l} · ${me.f[fk] == null ? 'n.d.' : num(me.f[fk], 0) + ' / 100'}</td></tr>` + ms.map(([k, ml, dir, t, scope, only]) => {
    if (only === 'corp' && me.bank) return `<tr><td class="l dm">${ml}</td><td colspan="4" class="l dm">sans objet pour une banque</td></tr>`;
    const peers = scope === 'peer' && isBRVM(s) ? SU.rows.filter(q => q.bank === me.bank) : SU.rows; const vals = peers.map(q => q[k]).filter(x => x != null && isFinite(x));
    const rk = me[k] != null ? vals.filter(x => dir > 0 ? x > me[k] : x < me[k]).length + 1 : null;
    return `<tr><td class="l">${ml}</td><td>${fmtM(t, me[k]) || NDc('donnée absente')}</td><td>${fmtM(t, medA(vals)) || '—'}</td><td style="background:${scoreCol(me.m[k])};color:#fff">${me.m[k] == null ? '—' : num(me.m[k], 0)}</td><td>${rk ? rk + ' / ' + vals.length : '—'}</td></tr>`; }).join('')).join('');
  m.innerHTML = `<div class="grid c2"><div class="grid" style="align-content:start">
      ${pn(`${esc(s.tk)} · score multifactoriel`, 'SCOR', `<div style="display:flex;gap:18px;align-items:center;padding:4px 2px"><div style="font-size:46px;line-height:1;color:${me.total >= 60 ? 'var(--up)' : me.total <= 40 ? 'var(--dn)' : 'var(--amber)'}">${num(me.total, 0)}<small style="font-size:16px;color:var(--dim)"> /100</small></div>

        <div class="cv" id="scB" style="height:220px"></div>`, { lect: 'Barres = score de chaque facteur (centile 0-100) ; trait = médiane de l’univers. Un score élevé dit que le titre se classe bien <b>par rapport aux autres</b> sur ces critères, pas qu’il montera.' })}

    ${pn('Détail des mesures', 'SCOR', `<table class="t"><thead><tr><th class="l">Mesure</th><th>${esc(s.id)}</th><th>Médiane</th><th>Centile</th><th>Rang</th></tr></thead><tbody>${detail}</tbody></table>`, { np: true, lect: `Valorisation, qualité et croissance comparées ${isBRVM(s) ? (me.bank ? 'aux banques de la BRVM' : 'aux sociétés de la BRVM hors banques') : 'aux actions US suivies'} ; momentum, rendement et volatilité comparés à tout le marché. Sources : comptes du dernier exercice publié, cours et dividendes du jour. n.d. = donnée absente des sources, jamais estimée.` })}</div>`;
  barChart($('scB'), { labels: fac.map(f => f.l), values: fac.map(f => f.v == null ? NaN : f.v), fmt: v => num(v, 0), labelsOnBars: true, colors: fac.map(f => f.v == null ? '#333' : f.v >= 60 ? '#2fd26a' : f.v <= 40 ? '#ff3d4d' : '#f9a33a'), refs: [{ v: 50, color: '#5e5e5e', label: '' }] });
};

/* ------------------------------------------------------------------ LQA : liquidité et coûts de transaction */
function rollSpread(c) { const d = []; for (let i = 1; i < c.length; i++) d.push(c[i] - c[i - 1]); let cv = 0, n = 0; const m1 = U.mean(d.slice(1)), m0 = U.mean(d.slice(0, -1)); for (let i = 1; i < d.length; i++) { cv += (d[i] - m1) * (d[i - 1] - m0); n++; } cv /= Math.max(1, n - 1); const p = U.mean(c); return cv < 0 ? 2 * Math.sqrt(-cv) / p : null; }
function csSpread(h, l) { const out = []; for (let i = 1; i < h.length; i++) { if (!(h[i] > 0 && l[i] > 0 && h[i - 1] > 0 && l[i - 1] > 0)) continue; const b = Math.log(h[i] / l[i]) ** 2 + Math.log(h[i - 1] / l[i - 1]) ** 2, g = Math.log(Math.max(h[i], h[i - 1]) / Math.min(l[i], l[i - 1])) ** 2;
  const k = 3 - 2 * Math.SQRT2, a = (Math.sqrt(2 * b) - Math.sqrt(b)) / k - Math.sqrt(g / k), s_ = 2 * (Math.exp(a) - 1) / (1 + Math.exp(a)); out.push(Math.max(0, s_)); } return out.length >= 10 ? U.mean(out) : null; }
PAGES.LQA = async (m, alive) => {
  const s = sec(ST.sec), brvm = isBRVM(s), ccy = s.ccy; setTitle('Liquidity Assessment');
  const [S, CAL] = await Promise.all([series(s.id), brvm ? series('BRVMC') : series(s.bench && Q.by[s.bench] ? s.bench : 'QQQ')]); if (!alive()) return;
  const P = lsGet('lqa.' + (brvm ? 'b' : 'u'), { q: brvm ? 10e6 : 1e6, p: 20, fee: '', days: 5 });
  const n = S.c.length, valOf = i => S.val && S.val[i] ? S.val[i] : (S.v[i] || 0) * S.c[i];
  const cal = CAL.x.filter(d => d > S.x[Math.max(0, n - 400)]); const have = new Map(S.x.map((d, i) => [d, i]));
  const win = k => { const ds = cal.slice(-k); const vals = ds.map(d => have.has(d) ? valOf(have.get(d)) : 0); return { ds, vals, zero: vals.filter(v => !v).length, traded: vals.filter(v => v > 0) }; };
  const W20 = win(20), W60 = win(60), W250 = win(250);
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const adv20 = mean(W20.vals), adv60 = mean(W60.vals), med60 = medA(W60.vals), medT60 = medA(W60.traded), freq = W250.traded.length / Math.max(1, W250.vals.length);

    <div class="grid c2">${pn(`${esc(s.tk)} · valeur selon plusieurs méthodes (cours ${px(s, price)} ${esc(s.ccy)})`, 'RV', `<table class="t"><thead><tr><th class="l">Méthode</th><th>Valeur / action</th><th>Marge de sécurité</th><th class="l">Hypothèses</th></tr></thead><tbody>

      ${pn('Sensibilité du P/B justifié (valeur par action)', 'RV', `<table class="t"><thead><tr><th class="l">ROE \\ g</th>${gs.map(g => `<th>${num(g * 100, 0)} %</th>`).join('')}</tr></thead><tbody>${rs.map(roe => `<tr><td class="l am">${num(roe * 100, 1)} %</td>${gs.map(g => { const v = just(roe, g, H.r); return `<td style="${mcol(mos(v))}">${v != null && v > 0 ? px(s, v) : '—'}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`,

};

    ${pn(`Historique des événements · ${H.length}`, 'CN', `<div class="tw" style="max-height:72vh"><table class="t" style="table-layout:fixed;width:100%"><colgroup><col style="width:82px"><col style="width:150px"><col><col style="width:62px"></colgroup><thead><tr><th class="l">Date</th><th class="l">Type</th><th class="l">Événement</th><th class="l">Source</th></tr></thead><tbody>${HL.slice(0, 400).map(h => `<tr><td class="l" style="vertical-align:top">${fds(h.d)}</td><td class="l" style="white-space:normal;vertical-align:top;color:${h.an ? 'var(--dn)' : EV_COL[h.k] || 'var(--amber)'}">${esc(h.k)}</td><td class="l" style="white-space:normal;vertical-align:top">${h.u ? `<a href="${esc(h.u)}" target="_blank" rel="noopener" style="color:var(--white)">${esc(h.t || '')}</a>` : esc(h.t || '')}</td><td class="l dm" style="vertical-align:top;overflow:hidden;text-overflow:ellipsis">${esc(h.s || '')}</td></tr>`).join('') || '<tr><td class="l dm" colspan="4">Aucun événement.</td></tr>'}</tbody></table></div>`,

/* ------------------------------------------------------------------ SRCH : obligations cotées à la BRVM (rendement, duration, sensibilité) */
const CTY_OBL = { TPCI: "Côte d'Ivoire", TPSN: 'Sénégal', TPBJ: 'Bénin', TPBF: 'Burkina Faso', TPML: 'Mali', TPNE: 'Niger', TPTG: 'Togo', TPGB: 'Guinée-Bissau', EOM: 'Mali', EOS: 'Sénégal', SNTS: 'Sénégal' };
const parseFr = d => { const m = String(d || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? new Date(Date.UTC(+m[3], +m[2] - 1, +m[1])) : null; };
/* Hypothèses explicites : coupon sur le nominal restant (estimé = dernier coupon ÷ taux, semestriel si le cours vaut ~2 fois ce nominal), remboursement in fine du nominal restant
   à la date anniversaire du dernier coupon, l'année d'échéance indiquée dans le nom ; base exact/365, taux actuariel annuel. */
function bondCalc(b, today = new Date()) {
  const o = { ok: false };
  if (!b.cpn || !b.y1 || !b.px) { o.why = b.cpn ? 'échéance ou cours absent' : 'taux variable ou coupon non publié'; return o; }
  const lp = parseFr(b.lp_d); let N = b.lp_v && b.cpn ? b.lp_v / b.cpn : null, f = 1;
  /* un cours se situe entre ~75 % et ~130 % du nominal : un rapport voisin de 2 signale un coupon semestriel */
  if (N) { /* nominal ≤ nominal d'émission usuel (10 000) ; cours entre 75 % et 130 % du nominal */
    const cand = [[N, 1], [2 * N, 2]].filter(([n]) => n <= 10150 && b.px / n >= .75 && b.px / n <= 1.3);
    if (cand.length !== 1) { Object.assign(o, { N, why: 'cours et coupon incohérents avec un nominal unique (amortissement ou cours ancien)' }); return o; }
    [N, f] = cand[0]; if (Math.abs(N - 10000) < 150) N = 10000; }
  if (!N) N = 10000;
  o.amort = N < 9900;
  /* obligation amortissable : l'échéancier (et donc le nominal restant après le dernier amortissement) n'est pas publié — pas de rendement calculé */
  if (o.amort) { Object.assign(o, { N, f, why: 'amortissable : échéancier non publié' }); return o; }
  const day = lp ? [lp.getUTCMonth(), lp.getUTCDate()] : [11, 31]; const T = new Date(Date.UTC(b.y1, day[0], day[1]));
  o.N = N; o.f = f; o.T = T; o.nomEst = !!b.lp_v;
  if (T <= today) { o.why = 'arrivée à échéance'; o.matured = true; return o; }
  const flows = []; let d = new Date(T); while (d > today) { flows.unshift(new Date(d)); d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 12 / f, d.getUTCDate())); }
  const cf = flows.map((t, i) => ({ t: (t - today) / 864e5 / 365, v: N * b.cpn / f + (i === flows.length - 1 ? N : 0) }));
  const dirty = b.px + (b.cc || 0); const pv = r => cf.reduce((s, c) => s + c.v / Math.pow(1 + r, c.t), 0);
  let lo = -0.5, hi = 1.5; for (let k = 0; k < 120; k++) { const mid = (lo + hi) / 2; if (pv(mid) > dirty) lo = mid; else hi = mid; } const y = (lo + hi) / 2;
  const mac = cf.reduce((s, c) => s + c.t * c.v / Math.pow(1 + y, c.t), 0) / pv(y);
  if (y > .25 || y < -.05) { Object.assign(o, { why: 'cours non représentatif (rendement hors norme)' }); return o; }
  Object.assign(o, { ok: true, ytm: y, cy: N * b.cpn / b.px, mac, mod: mac / (1 + y), sens: -mac / (1 + y) * b.px / 100, life: (T - today) / 864e5 / 365, cf, par: Math.abs(b.px / N - 1) < .005, pctN: b.px / N });
  return o;
}

function gcDraw(host, lines) {
  const { x, w, h } = setupCanvas(host); const padL = 46, padB = 22, padT = 10, W = w - padL - 12, H = h - padT - padB; const all = lines.flatMap(l => l.pts.map(p => p[1])).filter(v => v != null && isFinite(v));
  if (!all.length) return; let lo = Math.min(...all), hi = Math.max(...all); const pd = (hi - lo) * .1 || .005; lo -= pd; hi += pd;
  const tmax = Math.max(10, ...lines.flatMap(l => l.pts.map(p => p[0]))) * 1.04;
  const X = t => padL + Math.log(t * 12) / Math.log(tmax * 12) * W, Y = v => padT + (hi - v) / (hi - lo) * H; x.font = FNUM;
  x.setLineDash([1, 3]); for (const t of niceTicks(lo * 100, hi * 100, 5)) { const yy = Math.round(Y(t / 100)) + .5; x.strokeStyle = 'rgba(160,160,160,.35)'; x.beginPath(); x.moveTo(padL, yy); x.lineTo(w - 12, yy); x.stroke(); x.fillStyle = '#ddd'; x.textAlign = 'right'; x.fillText(num(t, 1) + '%', padL - 4, yy + 3); }
  const ticks = [[1 / 12, '1M'], [.25, '3M'], [.5, '6M'], [1, '1A'], [2, '2A'], [3, '3A'], [5, '5A'], [7, '7A'], [10, '10A'], [15, '15A'], [20, '20A'], [30, '30A']].filter(t => t[0] <= tmax); for (const [t, l] of ticks) { const xx = Math.round(X(t)) + .5; x.beginPath(); x.moveTo(xx, padT); x.lineTo(xx, padT + H); x.stroke(); x.fillStyle = '#ddd'; x.textAlign = 'center'; x.fillText(l, xx, h - 6); } x.setLineDash([]);
  lines.forEach((l, k) => { x.strokeStyle = l.col; x.lineWidth = l.w || 1.6; x.beginPath(); l.pts.forEach((p, i) => { if (p[1] == null) return; i ? x.lineTo(X(p[0]), Y(p[1])) : x.moveTo(X(p[0]), Y(p[1])); }); x.stroke(); x.fillStyle = l.col; l.pts.forEach(p => { if (p[1] == null) return; x.beginPath(); x.arc(X(p[0]), Y(p[1]), 2.4, 0, 7); x.fill(); }); });
  let ly = padT + 4; x.font = FUI; x.textAlign = 'left'; for (const l of lines.slice(-9)) { x.fillStyle = 'rgba(0,0,0,.75)'; x.fillRect(padL + 6, ly - 1, x.measureText(l.lab).width + 22, 14); x.fillStyle = l.col; x.fillRect(padL + 9, ly + 3, 8, 6); x.fillStyle = '#e6e6e6'; x.fillText(l.lab, padL + 21, ly + 9); ly += 15; }
  host.onmousemove = e => { const r = host.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; let best = null, bd = 100; for (const l of lines) for (const p of l.pts) { const d = (X(p[0]) - mx) ** 2 + (Y(p[1]) - my) ** 2; if (d < bd) { bd = d; best = [l, p]; } }
    if (best) tip(e, `<b>${esc(best[0].lab)}</b> · ${best[1][0] < 1 ? num(best[1][0] * 12, 0) + ' mois' : num(best[1][0], 0) + ' an(s)'} : <b>${num(best[1][1] * 100, 2)} %</b>`); else untip(); }; host.onmouseleave = untip;
}

  const oil = ['BRENT', 'WTI', 'NATGAS', 'USO', 'XLE'].map(id => Q.by[id]).filter(Boolean);
  const onews = (N.items || []).filter(x => /p[ée]trol(e|i[eè]re?s?)\b|\bbrent\b|\bwti\b|\boil\b|\bcrude\b|opep|opec|baril|barrel|ormuz|hormuz|tanker|raffinerie|refiner/i.test(x.ti)).slice(0, 40);

      ${WP ? pn('Stocks pétroliers des États-Unis (Mb)', 'BMAP', `<table class="t"><thead><tr><th class="l"></th><th>${esc((WP.hdr || [])[1] || '')}</th><th>sem. préc.</th><th>Var.</th><th>il y a 1 an</th></tr></thead><tbody>${['Crude Oil', 'Commercial (Excluding SPR)', 'Strategic Petroleum Reserve (SPR)', 'Total Motor Gasoline', 'Distillate Fuel Oil'].map(k => wr(k) ? `<tr><td class="l am">${{ 'Crude Oil': 'Brut (total)', 'Commercial (Excluding SPR)': 'Brut commercial', 'Strategic Petroleum Reserve (SPR)': 'Réserve stratégique', 'Total Motor Gasoline': 'Essence', 'Distillate Fuel Oil': 'Distillats' }[k]}</td><td>${num(wr(k)[0], 1)}</td><td>${num(wr(k)[1], 1)}</td><td class="${cls(wr(k)[2])}">${num(wr(k)[2], 1)}</td><td>${num(wr(k)[4], 1)}</td></tr>` : '').join('')}</tbody></table>`, { np: true, lect: `Source : ${esc(WP.src || 'EIA')}, relevé le ${fds(WP.d)}. Publication hebdomadaire (mercredi).` }) : ''}
      ${pn(`Actualités du pétrole (${onews.length})`, 'TOP', `<div style="max-height:360px;overflow:auto">${onews.map(x => newsRow2(x, { short: true })).join('') || '<div class="dm">Aucune dépêche récente.</div>'}</div>`)}</div></div>`;
  /* dessin : projection équirectangulaire (latitudes 72 N à 56 S), routes animées */
  const host = $('bmC'); const cv = document.createElement('canvas'); host.appendChild(cv); const ctx = cv.getContext('2d');
  const byK = Object.fromEntries(CP.pts.map(p => [p.k, p])), vmax = Math.max(...CP.pts.map(p => p.v[yi]));
  let W = 0, H = 0, dpr = 1, land = null, t0 = performance.now(), hover = null;
  const PJ = (lon, lat) => [(lon + 180) / 360 * W, (72 - lat) / 128 * H];
  const size = () => { const r = host.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    land = document.createElement('canvas'); land.width = cv.width; land.height = cv.height; const g = land.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#020b1a'; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(80,110,150,.18)'; g.lineWidth = 1; for (let lo = -180; lo <= 180; lo += 30) { const [x0] = PJ(lo, 0); g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0, H); g.stroke(); } for (let la = -60; la <= 60; la += 30) { const [, y0] = PJ(0, la); g.beginPath(); g.moveTo(0, y0); g.lineTo(W, y0); g.stroke(); }
    g.fillStyle = '#1b2433'; g.strokeStyle = '#2f3b4f'; g.lineWidth = .7;
    for (const c of G.c) for (const r of c.r) { g.beginPath(); let px0 = null; r.forEach((p, i) => { const [x, y] = PJ(p[0], p[1]); if (i && Math.abs(x - px0) > W / 2) { g.moveTo(x, y); } else i ? g.lineTo(x, y) : g.moveTo(x, y); px0 = x; }); g.closePath(); g.fill(); g.stroke(); } };

    requestAnimationFrame(draw); };

  cv.onmousemove = e => { const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; hover = null; for (const p of CP.pts) { const [x, y] = PJ(p.lon, p.lat); if ((x - mx) ** 2 + (y - my) ** 2 < 26 * 26) hover = p; }

  cv.onmouseleave = () => { hover = null; untip(); };

    acts.map((a, i) => `<button class="ab${a.menu ? ' mn' : ''}${a.on ? ' on' : ''}" data-n="${a.n}" data-dd="1" data-ai="${i}"><em>${a.n})</em> ${esc(a.l)}</button>`).join('') +

function renderTbar() {

    ddOpen(e.currentTarget, [{ h: 'Fonctions associées à ' + ST.fn }].concat(list.map((c, i) => { const why = FN[c][1] === 'sec' ? avail(c, s) : null; return { n: i + 1, code: c, l: esc(FN[c][4]) + ' · ' + esc(FN[c][0]), off: !!why, tt: why || FN[c][3], run: () => go(c, FN[c][1] === 'sec' ? ST.sec : undefined) }; }), [{ h: '' }, { code: 'MENU', l: 'Toutes les fonctions du titre', run: () => go('MENU') }])); };
}
/* En-tête du titre sur deux lignes, comme Bloomberg : ticker, devise, ▲ cours, variation, mini-graphique, pré/post-marché ;
   puis heure, volume, ouverture, plus haut, plus bas, montant échangé. */
function renderSech() {
  const b = $('sech'), s = sec(ST.sec); if (!SECFN.has(ST.fn) || !s) { b.hidden = true; return; } b.hidden = false;
  const q = s.q || {}, ch = s.last - s.prev, c = cls(ch), arr = ch > 0 ? '↑' : ch < 0 ? '↓' : '';
  const brvm = s.mkt === 'BRVM', us = s.mkt === 'US';
  const tm = q.t ? q.t : Q.quotes && Q.quotes.ts && s.live ? new Date(Q.quotes.ts * 1000).toLocaleTimeString('fr-FR', { timeZone: brvm ? 'Africa/Abidjan' : 'Europe/Paris', hour: '2-digit', minute: '2-digit' }) + (brvm ? ' GMT' : '') : null;
  const x = q.ext; const xt = x && x.last ? `<span class="xt"><span class="lb">${x.s === 'pre' ? 'Pré-marché' : 'Après-bourse'}</span><span class="${cls(x.chg)}">${px(s, x.last)} ${x.chg != null ? (x.chg > 0 ? '+' : '') + num(x.chg, 2) : ''} (${x.pct != null ? (x.pct > 0 ? '+' : '') + num(x.pct * 100, 2) + '%' : '—'})</span>${x.t ? ` <span class="ex">${esc(x.t)}</span>` : ''}</span>` : '';

      <span class="p ${c}">${arr}${px(s, s.last)}</span><span class="${c}">${ch > 0 ? '+' : ''}${px(s, ch)}</span><span class="${c}">${s.pct != null ? (s.pct > 0 ? '+' : '') + num(s.pct * 100, 2) + '%' : ''}</span>${sp}${xt}

      ${kv('Val', q.val ? big(q.val) : brvm && s.vday ? big(s.vday) : null)}${kv('Préc', px(s, s.prev))}${kv('52s', s.hi52 ? px(s, s.lo52) + ' – ' + px(s, s.hi52) : null)}${s.mcap ? kv('Capi', big(s.mcap), ' ' + (brvm ? 'XOF' : 'USD')) : ''}${s.per ? kv('PER', num(s.per, 1)) : ''}${s.yld ? kv('Rdt', num(s.yld * 100, 2) + '%') : ''}
      ${us && q.ms ? `<span class="ex">${esc(q.ms)}</span>` : ''}</div>`;

/* Bandeau d'actualités du bas : les 4 dernières dépêches, numérotées, avec source et heure. */
let NEWS_CACHE = null;

  document.documentElement.style.setProperty('--nwh', p.offsetHeight + 'px');
  $('nwTop').onclick = () => go('TOP'); $('nwMin').onclick = () => { ST.newsMin = !ST.newsMin; try { localStorage.setItem('fqt.newsMin', ST.newsMin ? '1' : ''); } catch (e) { } renderNews().then(() => window.dispatchEvent(new Event('resize'))); };
  p.querySelectorAll('[data-u]').forEach(r => r.onclick = () => { if (r.dataset.u) window.open(r.dataset.u, '_blank', 'noopener'); });

function srcCode(x) { const s = (x.s || x.f || '').toLowerCase();
  const M = [['brvm', 'BRVM'], ['sika', 'SIKA'], ['sec.gov', 'SEC'], ['edgar', 'SEC'], ['reuters', 'RTRS'], ['bloomberg', 'BBG'], ['zonebourse', 'ZB'], ['boursorama', 'BOURSO'], ['les echos', 'ECHOS'], ['jeune afrique', 'JA'], ['financial afrik', 'FAFRIK'], ['financialafrik', 'FAFRIK'], ['agence ecofin', 'ECOFIN'], ['ecofin', 'ECOFIN'], ['bceao', 'BCEAO'], ['fed', 'FED'], ['cnbc', 'CNBC'], ['marketwatch', 'MW'], ['yahoo', 'YHOO'], ['nasdaq', 'NDAQ'], ['lefigaro', 'FIGARO'], ['le monde', 'MONDE'], ['abidjan', 'ABJ.NET'], ['apa', 'APA'], ['afp', 'AFP']];

/* ---------- routeur et historique (◀ ▶) ---------- */
let renderSeq = 0;
function go(fn, s, o = {}) {
  if (fn && FN[fn]) ST.fn = fn; if (s && Q.by[s]) ST.sec = s;
  if (!o.nohist) { const cur = [ST.fn, ST.sec]; const last = ST.hist[ST.hpos]; if (!last || last[0] !== cur[0] || (SECFN.has(cur[0]) && last[1] !== cur[1])) { ST.hist = ST.hist.slice(0, ST.hpos + 1); ST.hist.push(cur); if (ST.hist.length > 60) ST.hist.shift(); ST.hpos = ST.hist.length - 1; } }
  try { history.replaceState(null, '', '#' + ST.fn + (SECFN.has(ST.fn) ? '~' + ST.sec : '')); } catch (e) { } ddClose(); render(); window.scrollTo(0, 0);
}
function histGo(d) { const k = ST.hpos + d; if (k < 0 || k >= ST.hist.length) return; ST.hpos = k; const [f, s] = ST.hist[k]; go(f, s, { nohist: true }); }
function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); if (!h) return; const [f, s] = h.split('~'); if (FN[f]) ST.fn = f; if (s && Q.by[s]) ST.sec = s; }
async function render() {
  const seq = ++renderSeq; untip(); PG.acts = []; PG.title = null; $('ptabs').hidden = true; $('ptabs').innerHTML = '';
  renderKeys(); renderTbar(); renderSech(); renderRbar(); renderStatus(); feedState(); clocksTick();
  const m = $('main'); m.innerHTML = '<div class="empty">Chargement…</div>';
  const why = SECFN.has(ST.fn) && ST.fn !== 'MENU' ? avail(ST.fn, sec(ST.sec)) : null;
  if (why) { m.innerHTML = `<div class="pn"><div class="pt">${esc(ykey(sec(ST.sec)))} · ${FN[ST.fn][0]}<span class="code">${ST.fn}</span></div><div class="pb"><div class="empty">Non disponible pour ce titre : ${esc(why)}.<br><br><button class="tb" data-fn="MENU">Voir les fonctions disponibles</button></div></div></div>`; return; }
  if (!PAGES[ST.fn]) { m.innerHTML = '<div class="empty">Fonction en préparation.</div>'; return; }
  try { await PAGES[ST.fn](m, () => seq === renderSeq); }
  catch (e) { console.error(e); if (seq === renderSeq) m.innerHTML = `<div class="empty">Impossible d'afficher cette fonction : ${esc(e.message)}</div>`; }
}
function renderKeys() { $('fkeys').innerHTML = MKT_KEYS.filter(has).map(k => `<button class="fk ${ST.fn === k ? 'on' : ''}" data-fn="${k}" title="${esc(FN[k][4] + ' — ' + FN[k][3])}"><b>${k}</b><span>${FN[k][0]}</span></button>`).join(''); }

    <span>Sources : brvm.org · SikaFinance · BCEAO · UMOA-Titres · Nasdaq · SEC · FRED · CBOE · CNN · EIA · Coinbase · Banque mondiale — outil d'analyse, pas un conseil en investissement</span>`;
}
let clocksTick = () => { };
function clocks() { const z = [['ABJ', 'Africa/Abidjan'], ['PAR', 'Europe/Paris'], ['NY', 'America/New_York'], ['TYO', 'Asia/Tokyo']];
  clocksTick = () => { const c = $('clocks'); if (c) c.innerHTML = z.map(([k, tz]) => `<span>${k} <b>${new Date().toLocaleTimeString('fr-FR', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: k === 'ABJ' ? '2-digit' : undefined })}</b></span>`).join(''); };
  clocksTick(); setInterval(clocksTick, 1000); }
function feedState() { const L = Q.live && Q.live.qqq, f = $('feed'); if (!f) return; const age = Q.live ? Date.now() / 1000 - (Q.live.ts || 0) : 1e9;
  const live = L && L.state === 'REGULAR' && age < 40 * 60; f.classList.toggle('live', !!live);
  $('feedTxt').textContent = live ? 'FLUX 15 MIN' : Q.live ? 'MAJ ' + new Date(Q.live.ts * 1000).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'EOD ' + fd(Q.sum.asof); }
function toast(msg, ms = 6000) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ms); }

/* ---------- flux en direct (base de l'artifact écrite par la tâche de synchro) + relecture (hébergement statique) ---------- */
async function initFeed() {
  if (!window.claude || !window.claude.use) { setInterval(pollStatic, 5 * 60 * 1000); return; }
  let db = null; try { db = await window.claude.use('db'); } catch (e) { } if (!db) return;
  const apply = () => { applyQuotes(); for (const p of Object.values(Q.ser)) p.then(applyQuoteToSeries); Q.M = {}; feedState(); renderSech(); renderStatus(); if (['MON', 'BRVM', 'IMAP', 'US'].includes(ST.fn)) render(); };

  try { db.doc('feed/quotes').onSnapshot(sn => { if (sn.exists) { const d = sn.data(); if (!Q.quotes || (d.ts || 0) >= (Q.quotes.ts || 0)) { Q.quotes = d; apply(); } } }, () => { }); } catch (e) { }

}
async function pollStatic() { try { const [l, q] = await Promise.all([fetch(Q.base + 'live.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null), fetch(Q.base + 'quotes.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null)]);
  if (l) Q.live = l; if (q) { Q.quotes = q; applyQuotes(); Q.ser = {}; Q.M = {}; } delete Q.json['news.json']; feedState(); renderSech(); renderStatus(); renderNews(); if (['MON', 'BRVM', 'IMAP', 'US', 'TOP'].includes(ST.fn)) render(); } catch (e) { } }
let SYNC_RUN = null;
function bindSync() { const b = $('syncBtn'); if (!b || !SYNC_RUN) return; b.hidden = false; b.onclick = () => SYNC_RUN(b); }
async function initSync() {
  if (!/^trig_/.test(TRIGGER_ID) || !window.claude || !window.claude.use) return; let mcp = null; try { mcp = await window.claude.use('mcp'); } catch (e) { } if (!mcp) return;

/* ---------- démarrage ---------- */
async function boot() {
  readCL(); renderKeysSkeleton(); try { ST.newsMin = localStorage.getItem('fqt.newsMin') === '1'; } catch (e) { }
  try { Q.sum = await getJSON('summary.json'); } catch (e) { $('main').innerHTML = `<div class="empty">Données introuvables (data/summary.json).</div>`; return; }

}
