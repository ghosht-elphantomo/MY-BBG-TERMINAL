<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FQT Terminal</title>
<meta name="description" content="Terminal de marché : BRVM (48 actions, indices, dividendes, avis), actions US, macro et or, backtests et statistiques.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed terminal — command line, function keys, active-security strip, page grid of
   hard-edged panels (navy title bars) on pure black; amber labels, white figures, mono numerals. */
:root{
  --bg:#000; --bg2:#0a0a0a; --bg3:#121212; --bg4:#1a1a1a;
  --line:#242424; --line2:#353535;
  --amber:#ffa028; --amber2:#b86e10; --white:#f4f4f4; --txt:#d6d6d6; --dim:#8c8c8c; --dim2:#5a5a5a;
  --up:#34d26e; --dn:#ff4b42; --navy:#0e2148; --navy2:#173a78; --red:#8f1d16; --red2:#b8291f; --yel:#ffd200;
  --cyan:#56c8f5; --violet:#b69cff; --pink:#ff7ab2; --teal:#3fd3c0;
  --ui:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --num:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100%}
body{margin:0;color:var(--txt);font:400 12px/1.3 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cyan)}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--yel);outline-offset:0}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--dim)} .am{color:var(--amber)} .wh{color:var(--white)} .dm{color:var(--dim)}

/* ---------- top: command line ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:stretch;gap:0;background:var(--bg);border-bottom:1px solid var(--line2);height:30px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.logo{display:flex;align-items:center;padding:0 12px;background:var(--amber);color:#000;font:700 13px/1 var(--ui);letter-spacing:.06em}
.cmd{flex:1;display:flex;align-items:center;position:relative;min-width:0;background:#000}
.cmd label{color:var(--amber);font:500 12px var(--num);padding:0 6px 0 10px;white-space:nowrap}
.cmd input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--yel);font:500 13px var(--num);text-transform:uppercase;letter-spacing:.04em;height:100%}
.cmd input::placeholder{color:var(--dim2);text-transform:none}
.go{background:var(--yel);color:#000;border:0;font:700 11px var(--ui);padding:0 14px;letter-spacing:.06em}
.ac{position:absolute;left:0;right:0;top:100%;background:#050505;border:1px solid var(--amber2);max-height:360px;overflow:auto;z-index:40}
.ac div{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;padding:4px 10px;cursor:pointer;font-size:12px}
.ac div b{color:var(--yel);font:500 12px var(--num)}
.ac div span:last-child{color:var(--dim);text-align:right}
.ac div.on,.ac div:hover{background:var(--navy)}
.clocks{display:flex;align-items:center;gap:14px;padding:0 12px;font:500 11px var(--num);color:var(--dim);white-space:nowrap;border-left:1px solid var(--line2)}
.clocks b{color:var(--white);font-weight:500}
.feed{display:flex;align-items:center;gap:6px;padding:0 10px;font:600 10px var(--ui);letter-spacing:.06em;border-left:1px solid var(--line2);white-space:nowrap}
.feed i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.feed.live i{background:var(--up)}
.feed button{background:var(--navy);border:1px solid var(--navy2);color:var(--white);font:600 10px var(--ui);padding:2px 7px;letter-spacing:.06em}

/* ---------- function keys ---------- */
.fkeys{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.fkeys::-webkit-scrollbar{display:none}
.fk{background:#0d0d0d;border:0;padding:5px 11px 4px;color:var(--txt);font:500 11.5px var(--ui);white-space:nowrap;display:flex;gap:5px;align-items:baseline}
.fk em{font-style:normal;color:var(--amber);font:500 10.5px var(--num)}
.fk b{color:var(--white);font-weight:700;letter-spacing:.03em}
.fk:hover{background:var(--bg4)}
.fk.on{background:var(--amber);color:#000}
.fk.on em,.fk.on b{color:#000}

/* ---------- security strip ---------- */
.secbar{display:flex;align-items:center;gap:18px;padding:5px 12px;background:#050505;border-bottom:1px solid var(--line2);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.secbar::-webkit-scrollbar{display:none}
.secbar .tk{font:700 15px var(--ui);color:var(--yel);letter-spacing:.02em}
.secbar .tk small{color:var(--amber);font-weight:500;font-size:12px;margin-left:6px}
.secbar .nm{color:var(--white);font-weight:500;font-size:13px}
.secbar .px{font:600 17px var(--num);color:var(--white)}
.secbar .kv{font-size:11px;color:var(--dim)}
.secbar .kv b{font:500 11.5px var(--num);color:var(--txt);margin-left:4px}

/* ---------- pages ---------- */
main{flex:1;padding:6px;display:grid;gap:6px;align-content:start;min-width:0}
.grid{display:grid;gap:6px;min-width:0}
.c2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.c2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.side{grid-template-columns:minmax(0,1fr) 300px}
.bt{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.pn{background:var(--bg);border:1px solid var(--line2);display:flex;flex-direction:column;min-width:0;position:relative}
.pt{display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--white);padding:3px 8px;font:700 11.5px var(--ui);letter-spacing:.04em;text-transform:uppercase;min-height:22px}
.pt .code{margin-left:auto;color:var(--amber);font:500 10.5px var(--num);text-transform:none}
.pt .sel{font-weight:400;color:#b9c6e4;text-transform:none}
.pb{padding:6px 8px;min-width:0;position:relative;overflow-x:auto}
.pb.np{padding:0}
.lect{border-top:1px solid var(--line);padding:4px 8px 5px;color:var(--dim);font-size:11.5px;line-height:1.4}
.lect b{color:var(--amber);font-weight:600}
.lect strong{color:var(--white);font-weight:600}
.cv{position:relative;width:100%}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{display:flex;flex-wrap:wrap;gap:3px 2px;padding:4px 6px;border-bottom:1px solid var(--line);background:#050505;align-items:center}
.tb{background:var(--red);border:0;color:var(--white);font:500 11px var(--ui);padding:2px 8px;white-space:nowrap}
.tb em{font-style:normal;color:#ffb3a8;font:500 10px var(--num);margin-right:3px}
.tb:hover{background:var(--red2)}
.tb.on{background:var(--amber);color:#000}
.tb.on em{color:#5c3200}
.tb.alt{background:#1b1b1b;color:var(--txt);border:1px solid var(--line2)}
.tb.alt.on{background:var(--white);color:#000}
.tsep{width:10px}
.tlab{color:var(--amber);font-size:11px;margin:0 3px 0 6px}
.tools input,.tools select,.form input,.form select{background:#000;border:1px solid var(--line2);color:var(--yel);font:500 11.5px var(--num);padding:2px 6px;height:21px}
.tools input{width:90px;text-transform:uppercase}

/* tables */
.tw{overflow:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{position:sticky;top:0;background:#0b0b0b;color:var(--amber);font:500 11px var(--ui);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line2);white-space:nowrap;z-index:1}
.t th.l,.t td.l{text-align:left}
.t th[data-k]{cursor:pointer}
.t th.on{color:var(--yel)}
.t td{padding:2px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid #111;font-family:var(--num);font-size:11.5px;color:var(--txt)}
.t td.l{font-family:var(--ui);font-size:12px}
.t tr:nth-child(even) td{background:#060606}
.t tr.sec td{background:#101010!important;color:var(--amber);font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding-top:5px}
.t tr[data-sec]{cursor:pointer}
.t tr[data-sec]:hover td{background:var(--navy)!important}
.t tr.cur td{background:#2a1c05!important}
.t .tk{color:var(--yel);font-family:var(--num);font-weight:500}
.t .nm{color:var(--white)}
.rng{display:inline-block;width:70px;height:7px;background:#1c1c1c;position:relative;vertical-align:middle}
.rng i{position:absolute;top:-2px;width:2px;height:11px;background:var(--amber)}
.spk{display:inline-block;vertical-align:middle}
.hm td{font-size:11px;padding:2px 4px}

/* key-value lists */
.kv2{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:12px}
.kv2 span{color:var(--amber);padding:2px 0;border-bottom:1px solid #121212}
.kv2 b{font:500 12px var(--num);color:var(--white);text-align:right;padding:2px 0;border-bottom:1px solid #121212}
.kv2 .h{grid-column:1/-1;color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding-top:6px;border:0}
.big{font:600 22px var(--num);color:var(--white)}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:11.5px}
.form label{display:flex;flex-direction:column;gap:2px;color:var(--amber)}
.form label.f{grid-column:1/-1}
.form input,.form select{height:24px;width:100%}
.form .run{grid-column:1/-1;background:var(--yel);color:#000;border:0;font:700 12px var(--ui);padding:6px;letter-spacing:.06em}
.desc{color:var(--dim);font-size:11.5px;line-height:1.45;grid-column:1/-1}

/* misc */
.chips{display:flex;flex-wrap:wrap;gap:3px}
.tmap{position:relative;width:100%}
.tmap div{position:absolute;overflow:hidden;border:1px solid #000;padding:3px 4px;cursor:pointer;font-size:11px;line-height:1.15;color:#fff}
.tmap div b{display:block;font:600 11.5px var(--num)}
.tmap div:hover{outline:1px solid var(--yel);z-index:2}
.ev{display:grid;grid-template-columns:72px 50px 1fr;gap:6px;padding:3px 0;border-bottom:1px solid #121212;font-size:11.5px}
.ev .d{color:var(--dim);font-family:var(--num);font-size:11px}
.ev .tk{color:var(--yel);font-family:var(--num);cursor:pointer}
.ev a{color:var(--txt);text-decoration:none}
.ev a:hover{color:var(--white);text-decoration:underline}
.ev .c{color:var(--amber);margin-right:6px}
.tip{position:fixed;z-index:60;pointer-events:none;background:#000;border:1px solid var(--amber);color:var(--txt);font:500 11px var(--num);padding:4px 7px;white-space:nowrap}
.status{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:3px 10px;border-top:1px solid var(--line2);background:#050505;color:var(--dim);font-size:11px;flex-wrap:wrap}
.status b{color:var(--amber);font-weight:500}
.empty{padding:30px;text-align:center;color:var(--dim)}
.pager{display:flex;gap:4px;align-items:center;padding:4px 6px;color:var(--dim);font-size:11px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;background:#000;border:1px solid var(--yel);color:var(--white);padding:8px 12px;font-size:12px;max-width:min(92vw,560px)}

@media (max-width:1100px){
  .c2,.c2b,.c3,.side,.bt{grid-template-columns:minmax(0,1fr)}
  .c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clocks{display:none}
}
@media (max-width:640px){
  .c4{grid-template-columns:minmax(0,1fr)}
  main{padding:6px 16px}
  .cmd label{display:none}
  .feed span{display:none}
  .form{grid-template-columns:1fr}
  .ns{display:none}
}

/* fonctions du titre (onglets sous la barre de cotation) */
.stabs{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.st{background:#070b16;border:0;padding:4px 10px 3px;color:var(--white);font:700 11.5px var(--ui);letter-spacing:.04em;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.st small{font:500 10.5px var(--ui);color:var(--dim);letter-spacing:0}
.st:hover{background:var(--navy)}
.st.on{background:var(--yel);color:#000}.st.on small{color:#000}
.st.off{color:var(--dim2)}.st.off small{color:var(--dim2)}
.ac div.off b,.ac div.off span{color:var(--dim2)}
.ac .hint{margin:0;padding:4px 10px;color:var(--dim);font-size:11px;border-top:1px solid var(--line2)}
.ac div{grid-template-columns:130px 1fr 84px}

/* menu du titre */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 18px}
.mg h4{margin:2px 0 4px;color:var(--amber);font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line2);padding-bottom:3px}
.mi{display:grid;grid-template-columns:30px 52px 1fr;grid-template-rows:auto auto;column-gap:6px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #111;padding:5px 4px;cursor:pointer;color:var(--txt);font:12px var(--ui)}
.mi em{font:500 12px var(--num);color:var(--amber);font-style:normal;grid-row:span 2}
.mi b{color:var(--yel);font:700 12.5px var(--ui);letter-spacing:.03em}
.mi span{color:var(--white);font-weight:500}
.mi small{grid-column:2/4;color:var(--dim);font-size:11px;line-height:1.35}
.mi:hover{background:var(--navy)}
.mi.off b,.mi.off span{color:var(--dim2)}
.lectb{font-size:12.5px;line-height:1.55;color:var(--txt);max-width:1100px}
.lectb p{margin:0 0 8px}.lectb b{color:var(--white)}
.pairf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line2)}
.pairf input{background:#000;border:1px solid var(--line2);color:var(--yel);font:500 12px var(--num);padding:3px 6px;width:110px;text-transform:uppercase}
.t th.vh{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;padding:4px 2px;white-space:nowrap}
.t tr.sep td{border-bottom:2px solid var(--amber2)}
.zbar{position:relative;height:9px;background:#111}.zbar i{position:absolute;top:0;bottom:0}
.zbar:after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--dim2)}
/* comptes, ratios, alertes, actualités */
.t.acc td{padding:2px 7px}.t.acc tr.sub td{font-size:11px;padding-top:0;padding-bottom:1px}
.t td.yl,.yl{color:var(--yel)!important}
.form small{color:var(--dim);font-size:10.5px;line-height:1.3}
h4.sub{margin:10px 0 4px;color:var(--amber);font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.07em}
.flag{padding:3px 6px;margin:2px 0;border-left:3px solid var(--dim2);font-size:12px;background:#0a0a0a}
.flag.dn{border-color:var(--dn)}.flag.am{border-color:var(--amber)}.flag.up{border-color:var(--up)}
.nw{display:grid;grid-template-columns:82px 92px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid #121212;font-size:12px}
.nw .d{color:var(--dim);font:11px var(--num)}.nw .c{color:var(--amber);font-size:11px}
.nw a{color:var(--white);text-decoration:none}.nw a:hover{color:var(--yel);text-decoration:underline}
.nw .src{color:var(--dim);font-size:11px;margin-left:4px}.nw small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
i.dot{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle}
@media(max-width:700px){.nw{grid-template-columns:70px 1fr}.nw .c{display:none}}
/* Fear & Greed, tuiles macro, étiquettes */
.fgc{cursor:pointer;padding:2px}.fgc.on{outline:1px solid var(--amber2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin:6px 0}
.tile{background:#070707;border:1px solid var(--line2);padding:6px 8px;cursor:pointer}
.tile:hover{border-color:var(--amber2)}.tile.on{border-color:var(--yel);background:#0c0c04}
.tile .tn{color:var(--amber);font-size:11px;line-height:1.25;height:28px;overflow:hidden}
.tile .tv{font:600 15px var(--num);color:var(--white)}.tile .tv small{font-size:10.5px;color:var(--dim)}
.tile .tc{font-size:10.5px;color:var(--txt)}.tile .ts{height:26px}
.nw .tags{grid-column:3;display:flex;gap:4px}.nw .tags b{font:600 10.5px var(--num);color:#000;background:var(--yel);padding:0 4px;cursor:pointer}
.recb{display:flex;height:8px;margin-top:8px;background:#111}.recb i{display:block;height:100%}
/* carte de chaleur */
.imap{position:relative;background:#000;overflow:hidden}
.imap .ims{position:absolute;box-sizing:border-box;border:1px solid #000;background:#111}
.imap .imh{position:absolute;left:0;right:0;top:0;height:15px;padding:0 4px;font:600 10.5px var(--ui);color:var(--amber);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;background:#0a0a0a}
.imap .imh span{color:var(--white);font-family:var(--num);text-transform:none}
.imap .imt{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.imap .imt:hover{outline:2px solid var(--yel);z-index:2}
.imap .imt b{font-family:var(--ui);font-weight:700;line-height:1.05}.imap .imt span{font:500 11px var(--num)}
.imleg{display:flex;gap:0;margin-top:6px}.imleg span{flex:1;text-align:center;font:500 10.5px var(--num);color:#fff;padding:2px 0}
.t tr.sep2 td{border-top:2px solid var(--amber2)}

</style>
</head><body>
<div id="app">
  <header class="top">
    <div class="logo" title="FOFCO Quant Terminal">FQT</div>
    <form class="cmd" id="cmdForm" autocomplete="off">
      <label for="cmd">&lt;CMD&gt;</label>
      <input id="cmd" spellcheck="false" placeholder="Ticker puis espace pour ses fonctions (SNTS FA, QQQ EE…), ou une fonction : FG, TOP, CORR…" aria-label="Ligne de commande">
      <button class="go" type="submit">&lt;GO&gt;</button>
      <div class="ac" id="ac" hidden></div>
    </form>
    <div class="clocks" id="clocks"></div>
    <div class="feed" id="feed"><i></i><span id="feedTxt">—</span><button id="syncBtn" hidden title="Récupérer tout de suite le dernier relevé">SYNC</button></div>
  </header>
  <nav class="fkeys" id="fkeys" aria-label="Fonctions"></nav>
  <div class="secbar" id="secbar"></div>
  <nav class="stabs" id="stabs" hidden aria-label="Fonctions du titre"></nav>
  <main id="main"><div class="empty">Chargement des données…</div></main>
  <footer class="status" id="status"></footer>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ================= FQT — quant engine (pure functions, no DOM) ================= */
'use strict';

/* Approximate effective Fed Funds rate by quarter (annual %). Used for cash yield and leveraged-ETF financing. */
const RF_Y = { 2000: 6.2, 2001: 3.9, 2002: 1.7, 2003: 1.1, 2004: 1.35, 2005: 3.2, 2006: 5.0, 2007: 5.0, 2008: 1.9, 2009: .16, 2010: .18, 2011: .1, 2012: .14, 2013: .11, 2014: .09, 2015: .13, 2016: .4 };
const RF_Q = {
  '2016Q3': .40, '2016Q4': .41, '2017Q1': .70, '2017Q2': .95, '2017Q3': 1.15, '2017Q4': 1.20, '2018Q1': 1.45, '2018Q2': 1.74,
  '2018Q3': 1.92, '2018Q4': 2.22, '2019Q1': 2.40, '2019Q2': 2.40, '2019Q3': 2.15, '2019Q4': 1.64, '2020Q1': 1.26,
  '2020Q2': .06, '2020Q3': .09, '2020Q4': .09, '2021Q1': .08, '2021Q2': .07, '2021Q3': .08, '2021Q4': .08,
  '2022Q1': .12, '2022Q2': .77, '2022Q3': 2.19, '2022Q4': 3.65, '2023Q1': 4.52, '2023Q2': 4.99, '2023Q3': 5.26,
  '2023Q4': 5.33, '2024Q1': 5.33, '2024Q2': 5.33, '2024Q3': 5.26, '2024Q4': 4.65, '2025Q1': 4.33, '2025Q2': 4.33,
  '2025Q3': 4.29, '2025Q4': 3.89, '2026Q1': 3.64, '2026Q2': 3.62
};
function rfFor(d) {
  const k = d.slice(0, 4) + 'Q' + (Math.floor((+d.slice(5, 7) - 1) / 3) + 1);
  if (RF_Q[k] != null) return RF_Q[k];

  if (o.cx != null) { xl = Math.min(xl, o.cx); xh = Math.max(xh, o.cx); } if (o.cy != null) { yl = Math.min(yl, o.cy); yh = Math.max(yh, o.cy); }
  if (o.sym) { const dx = Math.max(Math.abs(xh - o.cx), Math.abs(xl - o.cx)), dy = Math.max(Math.abs(yh - o.cy), Math.abs(yl - o.cy)); xl = o.cx - dx; xh = o.cx + dx; yl = o.cy - dy; yh = o.cy + dy; }
  const px = (xh - xl) * .06 || 1, py = (yh - yl) * .06 || 1; xl -= px; xh += px; yl -= py; yh += py;
  const W = w - padL - padR, H = h - padT - padB, X = v => padL + (v - xl) / (xh - xl) * W, Y = v => padT + (yh - v) / (yh - yl) * H; const fx = o.fx || fmtAxis, fy = o.fy || fmtAxis;
  if (o.quad) { const cx = X(o.cx), cy = Y(o.cy); const q = o.quad; x.fillStyle = q[0]; x.fillRect(cx, padT, padL + W - cx, cy - padT); x.fillStyle = q[1]; x.fillRect(padL, padT, cx - padL, cy - padT); x.fillStyle = q[2]; x.fillRect(padL, cy, cx - padL, padT + H - cy); x.fillStyle = q[3]; x.fillRect(cx, cy, padL + W - cx, padT + H - cy);

  x.font = FNUM; x.textAlign = 'right'; x.textBaseline = 'middle';
  for (const t of niceTicks(yl, yh, Math.max(2, Math.min(6, Math.floor(H / 40))))) { const yy = Math.round(Y(t)) + .5; x.strokeStyle = rgba(CL.dim2, .3); x.beginPath(); x.moveTo(padL, yy); x.lineTo(w - padR, yy); x.stroke(); x.fillStyle = CL.dim; x.fillText(fy(t), padL - 4, yy); }
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; for (const t of niceTicks(xl, xh, Math.max(2, Math.min(7, Math.floor(W / 70))))) { const xx = Math.round(X(t)) + .5; x.strokeStyle = rgba(CL.dim2, .3); x.beginPath(); x.moveTo(xx, padT); x.lineTo(xx, padT + H); x.stroke(); x.fillStyle = CL.dim; x.fillText(fx(t), xx, h - 5); }
  if (o.cx != null) { x.strokeStyle = CL.dim; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(X(o.cx) + .5, padT); x.lineTo(X(o.cx) + .5, padT + H); x.stroke(); x.setLineDash([]); }
  if (o.cy != null) { x.strokeStyle = CL.dim; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(padL, Y(o.cy) + .5); x.lineTo(padL + W, Y(o.cy) + .5); x.stroke(); x.setLineDash([]); }
  if (o.line) { const [a, b] = o.line; x.strokeStyle = o.lineColor || CL.amber; x.lineWidth = 1.2; x.setLineDash([5, 4]); x.beginPath(); x.moveTo(X(xl), Y(a + b * xl)); x.lineTo(X(xh), Y(a + b * xh)); x.stroke(); x.setLineDash([]); x.lineWidth = 1; }
  for (const p of P) if (p.trail && p.trail.length) { const tr = p.trail.concat([[p.x, p.y]]); for (let i = 1; i < tr.length; i++) { x.strokeStyle = rgba(p.color || CL.cyan, .15 + .7 * i / tr.length); x.lineWidth = 1.5; x.beginPath(); x.moveTo(X(tr[i - 1][0]), Y(tr[i - 1][1])); x.lineTo(X(tr[i][0]), Y(tr[i][1])); x.stroke(); }
    for (let i = 0; i < tr.length - 1; i++) { x.fillStyle = rgba(p.color || CL.cyan, .3 + .5 * i / tr.length); x.beginPath(); x.arc(X(tr[i][0]), Y(tr[i][1]), 1.8, 0, 7); x.fill(); } x.lineWidth = 1; }
  const many = P.length > (o.maxLabels || 30);
  for (const p of P.slice().sort((a, b) => (a.hi ? 1 : 0) - (b.hi ? 1 : 0))) { const r = p.r || (p.hi ? 5 : 3.5); x.fillStyle = p.color || rgba(CL.cyan, .8); x.beginPath(); x.arc(X(p.x), Y(p.y), r, 0, 7); x.fill();
    if (p.hi) { x.strokeStyle = CL.yel; x.lineWidth = 2; x.beginPath(); x.arc(X(p.x), Y(p.y), r + 3, 0, 7); x.stroke(); x.lineWidth = 1; }
    if (p.label && (!many || p.hi || o.labels)) { x.font = p.hi ? '600 11px "Roboto Condensed", sans-serif' : '500 10px "Roboto Condensed", sans-serif'; x.fillStyle = p.hi ? CL.yel : CL.txt; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(p.label, X(p.x) + r + 3, Y(p.y)); } }
  if (o.xlab) { x.fillStyle = CL.amber; x.font = FUI; x.textAlign = 'right'; x.textBaseline = 'bottom'; x.fillText(o.xlab, w - padR, padT + H - 3); } if (o.ylab) { x.fillStyle = CL.amber; x.font = FUI; x.textAlign = 'left'; x.textBaseline = 'top'; x.fillText(o.ylab, padL + 4, padT + 2); }
  const near = e => { const r = host.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; let b = null, bd = 144; for (const p of P) { const d = (X(p.x) - mx) ** 2 + (Y(p.y) - my) ** 2; if (d < bd) { bd = d; b = p; } } return b; };
  host.onmousemove = e => { const p = near(e); host.style.cursor = p && p.id ? 'pointer' : ''; if (p) tip(e, o.tipf ? o.tipf(p) : `<b>${esc(p.label || p.id)}</b> · ${fx(p.x)} · ${fy(p.y)}`); else untip(); };
  host.onmouseleave = untip; host.onclick = e => { const p = near(e); if (p && p.id && Q.by[p.id]) { untip(); go(o.to || (SECFN.has(ST.fn) ? ST.fn : 'MENU'), p.id); } };
}

<script>

const pn = (title, code, body, o = {}) => `<div class="pn" ${o.id ? `id="${o.id}"` : ''} ${o.style ? `style="${o.style}"` : ''}><div class="pt">${title}${o.sel ? `<span class="sel">${o.sel}</span>` : ''}<span class="code">${code || ''}</span></div>${o.tools ? `<div class="tools">${o.tools}</div>` : ''}<div class="pb ${o.np ? 'np' : ''}">${body}</div>${o.lect ? `<div class="lect">${o.lect}</div>` : ''}</div>`;

const legacy = s => /ancien/i.test(s.n);
function sortRows(rows, sort) { const { k, dir } = sort; return rows.slice().sort((a, b) => { const A = a[k], B = b[k]; if (A == null && B == null) return 0; if (A == null) return 1; if (B == null) return -1; return (typeof A === 'string' ? A.localeCompare(B) : A - B) * dir; }); }
function thSort(cols, sort) { return cols.map(([k, l, left]) => `<th data-k="${k}" class="${left ? 'l' : ''} ${sort.k === k ? 'on' : ''}">${l}${sort.k === k ? (sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join(''); }
function lastCross(c, s) { const n = c.length; const above = c[n - 1] > s[n - 1]; let k = n - 1; while (k > 0 && isFinite(s[k - 1]) && (c[k - 1] > s[k - 1]) === above) k--; return { above, k }; }

/* ------------------------------------------------------------------ MON */

    <div class="grid" style="align-content:start">

/* ------------------------------------------------------------------ CORR (BRVM × monde, paire au choix, valeur de référence) */
function weeklyReturns(W) {
  if (W._R) return W._R; const R = {};
  for (const [id, col] of Object.entries(W.s)) R[id] = col.map((v, i) => i && v != null && col[i - 1] != null && col[i - 1] > 0 && v > 0 ? Math.log(v / col[i - 1]) : null);
  return (W._R = R);
}
/* Corrélation de deux séries de rendements ; lag = 1 ajoute les covariances décalées d'une semaine (correction de Dimson pour cotations non synchrones). */
function corrPair(x, y, a, b, lag) {
  const m = (u, v, s) => { let sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, k = 0; for (let t = Math.max(a, 1); t < b; t++) { const p = u[t], q = v[t + s]; if (p == null || q == null) continue; sx += p; sy += q; sxx += p * p; syy += q * q; sxy += p * q; k++; }
    return k ? { cv: sxy / k - sx * sy / k / k, vx: sxx / k - sx * sx / k / k, vy: syy / k - sy * sy / k / k, k, mx: sx / k, my: sy / k } : null; };
  const z = m(x, y, 0); if (!z || z.k < Math.max(20, (b - a) * .45) || z.vx <= 0 || z.vy <= 0) return null;
  let cv = z.cv; if (lag) { const l1 = m(x, y, -1), l2 = m(x, y, 1); cv += (l1 ? l1.cv : 0) + (l2 ? l2.cv : 0); }
  return { r: U.clamp(cv / Math.sqrt(z.vx * z.vy), -1, 1), beta: cv / z.vy, n: z.k, alpha: z.mx - (cv / z.vy) * z.my };
}
PAGES.CORR = async (m, alive) => {

  const bIdx = main.concat(secsWhere(s => s.mkt === 'BRVM' && s.cls === 'Index' && !main.includes(s.id) && has(s.id) && !/ancien/i.test(s.n || '')).map(s => s.id));
  const bStk = secsWhere(s => s.mkt === 'BRVM' && s.cls === 'Equity' && has(s.id)).sort((p, q) => (q.mcap || 0) - (p.mcap || 0)).map(s => s.id);

  const mix = ['QQQ', 'SPY', 'VTI', 'EFA', 'EEM', 'AFK', 'SOXX', 'NVDA', 'TSM', '0050', 'BRVMC', 'BRVM30', 'SNTS', 'ORAC', 'SGBC', 'GLD', 'BRENT', 'WTI', 'NATGAS', 'TLT', 'HYG', 'VIX', 'EURUSD', 'USDXOF', 'BTC'].filter(has);

    ${sqr ? `<span class="tlab">Tri</span><button class="tb ${cs.ord === 'grp' ? 'on' : ''}" data-co="grp">${cs.u === 'BRVM' ? 'Indices puis actions' : 'Liste'}</button><button class="tb ${cs.ord === 'pc1' ? 'on' : ''}" data-co="pc1">1re composante</button>` : ''}`;

      <div class="tw" style="max-height:66vh"><table class="t" id="cRT"><thead><tr><th class="l">Titre</th><th class="l">Nom</th><th class="l">Marché</th><th>Corrélation</th><th style="width:140px"></th><th>Corr. 5 ans</th><th>Bêta</th><th>Semaines</th><th>Sans variation</th></tr></thead><tbody>

  } else {
    let rr = rows.slice(), cc = cols.slice(); const C = rr.map(p => cc.map(q => p === q ? { r: 1 } : corrPair(R[p], R[q], a, b, lag)));

    if (!pair) pair = [rr[0], cc.find(id => id !== rr[0] && id !== 'USDXOF') || cc[0]];

  m.innerHTML = `<div class="tools" style="border:1px solid var(--line2)">${tools}<span class="tlab">rendements hebdomadaires · ${fd(W.w[a])} → ${fd(W.w[b - 1])}</span></div>

      ${afterPca ? pn('Analyse en composantes principales', 'CORR', `<div class="grid c2b">${cvb('cE', 170)}${cvb('cA', 170)}</div>`, { lect: '<span id="cPl"></span>' }) : ''}</div></div>`;

    barChart($('cE'), { labels: varEx.map((_, i) => 'CP' + (i + 1)), values: varEx.map(v => v * 100), fmt: v => num(v, 0) + '%', pos: CL.cyan, labelsOnBars: true });

    $('cPl').innerHTML = `La 1re composante explique <strong>${num(varEx[0] * 100, 0)} %</strong> de la variance commune (facteur « marché »). Ratio d’absorption (à droite) : part de la 1re composante sur 52 semaines glissantes ; quand il monte, tout bouge ensemble et la diversification disparaît.`;
  }
};

<script>
/* ================= FQT — fonctions d'un titre : FA, RV, WACC, DVD, DDM, COMP, BETA, HP, CN ================= */

const faJSON = id => getJSON('fa/' + id.replace('.', '_') + '.json');
const P1 = (v, d = 1) => v == null || !isFinite(v) ? '—' : num(v * 100, d) + ' %';
const NDc = (why = '') => `<span class="dm" title="${esc(why)}">n.d.</span>`;
const yLab = d => String(Math.floor(d / 10000));
const isBRVM = s => s && s.mkt === 'BRVM';
/* Unités des comptes : US en millions de dollars, BRVM en milliards de FCFA (sources en millions). */
const unitOf = F => F.mkt === 'BRVM' ? { k: 1e-3, lab: 'Md FCFA', d: 1 } : { k: 1e-6, lab: 'M$', d: 0 };
function gr(a, i) { const p = a[i - 1], c = a[i]; return p != null && c != null && p > 0 ? c / p - 1 : null; }
function cagrA(a, n) { const idx = a.map((v, i) => v != null ? i : -1).filter(i => i >= 0); if (!idx.length) return null; const L = idx[idx.length - 1], j = L - n; if (j < 0 || a[j] == null || a[j] <= 0 || a[L] <= 0) return null; return Math.pow(a[L] / a[j], 1 / n) - 1; }

/* Lignes du tableau des comptes (clé, libellé, type). Types : m montant, p ratio (0-1), q pourcentage déjà en %, x multiple, e par action, s actions, g croissance de la ligne précédente. */
function accRows(F) {

    ['ni', 'Résultat net', 'm'], ['nm', 'Marge nette', 'p'], ['eps', 'BPA dilué ($)', 'e'], ['eps', 'croissance', 'g'], ['ocf', 'Flux de trésorerie d’exploitation', 'm'], ['capex', 'Investissements (capex)', 'm'],
    ['fcf', 'Free cash-flow', 'm', 'hl'], ['fcfm', 'Marge FCF', 'p'], ['fcf', 'croissance FCF', 'g'], ['sbc', 'Rémunération en actions', 'm'], ['div', 'Dividendes versés', 'm'], ['buy', 'Rachats d’actions', 'm'],
    ['cashx', 'Trésorerie et placements', 'm'], ['debt', 'Dette financière', 'm'], ['nd', 'Dette nette', 'm'], ['eq', 'Capitaux propres', 'm'], ['roe', 'ROE', 'p'], ['roic', 'ROIC (impôt 21 %)', 'p'], ['sh', 'Actions diluées (millions)', 's']];
  if (F.bank) return [['rev', 'Produit net bancaire', 'm'], ['rev', 'croissance', 'g'], ['ni', 'Résultat net', 'm'], ['nm', 'Marge nette', 'p'], ['eps', 'BNPA (FCFA)', 'e'], ['eps', 'croissance', 'g'],
    ['dps', 'Dividende net / action (FCFA)', 'e'], ['payout', 'Taux de distribution', 'p'], ['eq', 'Capitaux propres', 'm'], ['assets', 'Total bilan', 'm'], ['deposits', 'Dépôts de la clientèle', 'm'], ['loans', 'Crédits à la clientèle', 'm'],
    ['ld', 'Crédits / dépôts', 'p'], ['cir', 'Coefficient d’exploitation', 'q'], ['cor', 'Coût du risque', 'm'], ['cor_l', 'Coût du risque / crédits', 'p'], ['roe', 'ROE', 'p'], ['roa_s', 'ROA', 'q'], ['solv', 'Ratio de solvabilité', 'q']];
  return [['rev', 'Chiffre d’affaires', 'm'], ['rev', 'croissance', 'g'], ['ebitda', 'EBITDA', 'm'], ['ebit', 'Résultat d’exploitation', 'm'], ['om', 'Marge d’exploitation', 'p'], ['ni', 'Résultat net', 'm'], ['nm', 'Marge nette', 'p'],
    ['eps', 'BNPA (FCFA)', 'e'], ['eps', 'croissance', 'g'], ['dps', 'Dividende net / action (FCFA)', 'e'], ['payout', 'Taux de distribution', 'p'], ['ocf', 'Flux de trésorerie d’exploitation', 'm'], ['capex', 'Investissements (capex)', 'm'],
    ['fcf', 'Free cash-flow', 'm', 'hl'], ['fcfm', 'Marge FCF', 'p'], ['fcf', 'croissance FCF', 'g'], ['fpay', 'Dividendes / FCF', 'p'], ['eq', 'Capitaux propres', 'm'], ['nd', 'Dette nette', 'm'], ['cash', 'Trésorerie', 'm'],
    ['assets', 'Total bilan', 'm'], ['roe', 'ROE', 'p'], ['roic', 'ROIC (impôt légal)', 'p'], ['nd_ebitda', 'Dette nette / EBITDA', 'x']];
}
function yDerived(F) {
  const Y = F.Y, n = Y.y.length, dv = (a, b) => a.map((v, i) => v != null && b[i] ? v / b[i] : null);
  if (F.mkt === 'US') { Y.gm = Y.gm && Y.gm.length ? dv(Y.gp, Y.rev) : Y.gm; Y.om = dv(Y.opi, Y.rev); Y.nm = dv(Y.ni, Y.rev); Y.fcfm = dv(Y.fcf, Y.rev); if (!Y.cashx) Y.cashx = new Array(n).fill(null); }
  return Y;
}
function cellFmt(t, v, U) {
  if (v == null || !isFinite(v)) return null;
  return t === 'm' ? num(v * U.k, U.d) : t === 'p' ? num(v * 100, 1) : t === 'q' ? num(v, 1) : t === 'x' ? num(v, 2) : t === 'e' ? num(v, 2) : t === 's' ? num(v / 1e6, 0) : num(v, 2);
}
/* Tableau des comptes sur N exercices (10 par défaut), colonnes manquantes marquées n.d. avec la raison. */
function accountsTable(F, nY = 10, opts = {}) {
  const Y = yDerived(F), U = unitOf(F), rows = accRows(F);
  const have = Y.y.filter((y, i) => rows.some(([k]) => Y[k] && Y[k][i] != null));
  const last = have.length ? Math.max(...have) : new Date().getFullYear() - 1; const cols = []; for (let y = last - nY + 1; y <= last; y++) cols.push(y);
  const ix = y => Y.y.indexOf(F.mkt === 'US' ? Y.y.find(d => Math.floor(d / 10000) === y) : y);
  const firstData = have.length ? Math.min(...have) : null;
  const why = y => F.mkt === 'BRVM' ? (firstData && y < firstData ? `aucun compte publié avant ${firstData} dans les sources (SikaFinance : 5 exercices ; états financiers BRVM lus quand le PDF est exploitable)` : 'non publié dans les sources') : 'absent des dépôts XBRL à la SEC';
  const cg = (k, n) => { const a = cols.map(y => { const i = ix(y); return i >= 0 ? Y[k][i] : null; }); return cagrA(a, n); };
  const head = `<tr><th class="l">${U.lab}${F.mkt === 'US' ? ' · exercice clos' : ''}</th>${cols.map(y => `<th>${y}</th>`).join('')}${opts.cagr ? '<th>TCAM 3 a.</th><th>TCAM 5 a.</th><th>TCAM 10 a.</th>' : ''}</tr>`;
  const body = rows.filter(([k]) => Y[k]).map(([k, l, t, hl]) => {
    const vals = cols.map(y => { const i = ix(y); if (i < 0) return null; return t === 'g' ? gr(Y[k], i) : Y[k][i]; });
    if (vals.every(v => v == null) && t !== 'g') return '';
    const tds = vals.map((v, j) => { if (v == null) return `<td>${NDc(why(cols[j]))}</td>`; if (t === 'g') return `<td>${sgn(v, 1)}</td>`; return `<td class="${hl ? 'yl' : 'wh'}">${cellFmt(t, v, U)}</td>`; }).join('');
    const cc = opts.cagr && ['m', 'e'].includes(t) ? [3, 5, 10].map(n => `<td>${sgn(cg(k, n), 1)}</td>`).join('') : opts.cagr ? '<td></td><td></td><td></td>' : '';

  }).join('');

}
function faSrcNote(F) {
  return F.mkt === 'US' ? `Source : SEC EDGAR (XBRL des 10-K/10-Q${F.annual_only ? ', 20-F annuels' : ''}), devise ${F.ccy || 'USD'}. FCF = flux d’exploitation − acquisitions d’immobilisations corporelles. Dette financière hors obligations locatives.`
    : `Sources : SikaFinance (comptes, via BRVMetrics) et tableaux des flux de trésorerie lus dans les états financiers SYSCOHADA publiés sur brvm.org. FCF = flux d’exploitation − acquisitions d’immobilisations.${F.bank ? ' Banque : pas de FCF ni de valeur d’entreprise (le passif est l’outil de production).' : ''}`;
}

/* ------------------------------------------------------------------ FA */
PAGES.FA = async (m, alive) => {

  const Y = yDerived(F), U = unitOf(F), x = Y.y.map(y => F.mkt === 'US' ? y : y * 10000 + 1231);
  const kpi = [['Chiffre d’affaires', F.mkt === 'US' ? 'rev_g' : 'rev_g', 'croissance sur 1 an'], ['Free cash-flow', 'fcf_g', 'croissance sur 1 an'], ['Marge FCF', 'fcfm', ''], ['ROE', 'roe', ''], ['ROIC', 'roic', ''], ['Dette nette / EBITDA', 'nd_ebitda', '']];
  const tools = qtr ? `<span class="tlab">Vue</span><button class="tb ${st.v === 'A' ? 'on' : ''}" data-v="A">Annuelle (10 exercices)</button><button class="tb ${st.v === 'Q' ? 'on' : ''}" data-v="Q">Trimestrielle (12 mois glissants)</button>` : '<span class="tlab">Vue annuelle' + (F.mkt === 'BRVM' ? ' · les sociétés BRVM publient des comptes annuels (et semestriels non repris par les sources)' : '') + '</span>';
  const kv = `<div class="kv2">${[['Exercice de référence', F.fy || (F.asof_q ? fd(F.asof_q) : '—')], ['Croissance du CA', pc(F.rev_g, 1)], ['Croissance du résultat', pc(F.ni_g, 1)], ['Croissance du BPA', pc(F.eps_g, 1)], ['Croissance du FCF', pc(F.fcf_g, 1)],

    ['Marge d’exploitation', P1(F.om)], ['Marge FCF', P1(F.fcfm)], ['FCF / résultat net', F.conv != null ? num(F.conv, 2) + ' x' : '—'], ['ROE', P1(F.roe)], ['ROIC', P1(F.roic)], ['Dette nette / EBITDA', F.nd_ebitda != null ? num(F.nd_ebitda, 2) + ' x' : '—'],
    ['Score de Piotroski', F.fscore != null ? `${F.fscore} / ${F.fscore_n} critères` : '—'], F.altz != null ? ['Z d’Altman', num(F.altz, 2) + (F.altz < 1.8 ? ' <span class="dn">zone de détresse</span>' : F.altz > 3 ? ' <span class="up">zone saine</span>' : ' zone grise')] : null].filter(Boolean).map(([a, b]) => `<span>${a}</span><b>${b}</b>`).join('')}</div>`;

    main = `<div class="tw"><table class="t acc"><thead><tr><th class="l">${U.lab} · trimestre clos</th>${qs.map(q => `<th>${fd(q)}</th>`).join('')}</tr></thead><tbody>${R.map(([k, l, t]) => `<tr><td class="l am">${l}${t === 'p' ? ' %' : ''}</td>${qs.map((_, j) => { const v = H[k][k0 + j]; return `<td class="${k === 'fcf' ? 'yl' : 'wh'}">${v == null ? NDc() : cellFmt(t, v, U)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  } else main = accountsTable(F, 10, { cagr: true });
  m.innerHTML = `<div class="tools" style="border:1px solid var(--line2)">${tools}</div>

  m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { st.v = b.dataset.v; render(); });

const i2s = d => `${Math.floor(d / 10000)}-${String(Math.floor(d / 100) % 100).padStart(2, '0')}-${String(d % 100).padStart(2, '0')}`;
const s2i = s => +s.replace(/-/g, '');
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'fl';

/* ---------- data ---------- */
async function getJSON(path) { if (!Q.json[path]) Q.json[path] = fetch(Q.base + path, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); }); return Q.json[path]; }
async function series(id) {
  if (!Q.ser[id]) Q.ser[id] = getJSON('s/' + id.replace('.', '_') + '.json').then(b => {
    const n = b.d.length; const s = { id, f: b.f, x: b.d, d: b.d.map(i2s), c: b.c, o: b.o || b.c, h: b.h || b.c, l: b.l || b.c, v: b.v || new Array(n).fill(0), val: b.val || null, div: b.div || new Array(n).fill(0) };
    applyQuoteToSeries(s); return s; });
  return Q.ser[id];
}
async function market(id) { if (!Q.M[id]) { const s = await series(id); Q.M[id] = buildMarket({ d: s.d, o: s.o, h: s.h, l: s.l, c: s.c, v: s.v, div: s.div }); } return Q.M[id]; }
function sec(id) { return Q.by[id]; }
function secsWhere(f) { return Q.sum.secs.filter(f); }
function applyQuotes() {
  const q = Q.quotes && Q.quotes.q; if (!q) return;
  for (const [id, r] of Object.entries(q)) { const s = Q.by[id]; if (!s || !r.last) continue; const day = r.d ? s2i(r.d) : s.dt;
    if (day > s.dt) { s.prev = s.last; s.dt = day; } s.last = r.last; s.pct = r.pct != null ? r.pct : s.last / s.prev - 1; if (r.vol != null) s.shd = r.vol; s.live = true; }
}
function applyQuoteToSeries(s) {
  const q = Q.quotes && Q.quotes.q && Q.quotes.q[s.id]; if (!q || !q.last || !q.d) return; const day = s2i(q.d), n = s.x.length;
  if (day > s.x[n - 1]) { s.x.push(day); s.d.push(q.d); s.c.push(q.last); s.o.push(q.o || q.last); s.h.push(Math.max(q.h || q.last, q.last)); s.l.push(Math.min(q.l || q.last, q.last)); s.v.push(q.vol || 0); s.div.push(0); if (s.val) s.val.push(q.val || 0); s.prov = true; }
  else if (day === s.x[n - 1]) { s.c[n - 1] = q.last; s.h[n - 1] = Math.max(s.h[n - 1], q.last); s.l[n - 1] = Math.min(s.l[n - 1], q.last); if (q.vol != null) s.v[n - 1] = q.vol; }
}

/* ---------- command line ---------- */
function searchSecs(qs) {
  const q = qs.trim().toUpperCase(); if (!q) return [];
  const out = []; for (const s of Q.sum.secs) { const id = s.id.toUpperCase(), tk = s.tk.toUpperCase(), n = (s.n || '').toUpperCase(), sh = (s.short || '').toUpperCase();
    const sc = id === q ? 0 : tk.startsWith(q) ? 1 : id.startsWith(q) ? 2 : n.startsWith(q) || sh.startsWith(q) ? 3 : n.includes(q) || sh.includes(q) ? 4 : 9; if (sc < 9) out.push([sc, s]); }
  return out.sort((a, b) => a[0] - b[0] || (b[1].liq || 0) - (a[1].liq || 0)).map(x => x[1]);
}
function parseCmd(txt) {
  const toks = txt.trim().toUpperCase().replace(/<GO>|\bGO\b|EQUITY|INDEX|CURNCY|COMDTY/g, ' ').split(/\s+/).filter(Boolean);
  let fn = null, s = null; for (const t of toks) { if (!fn && FN[t]) { fn = t; continue; } if (t === 'AIDE') { fn = 'HELP'; continue; } if (!s) { const m = Q.by[t] || searchSecs(t)[0]; if (m) s = m.id; } }
  if (!s && toks.length > 1 && !fn) { const m = searchSecs(toks.join(' '))[0]; if (m) s = m.id; }
  return { fn, s };
}
function runCmd(txt) {
  const t = txt.trim(); if (ST.fn === 'MENU' && /^\d{1,2}$/.test(t)) { const it = menuItems(sec(ST.sec))[+t - 1]; if (it) { go(it, ST.sec); return; } }
  const { fn, s } = parseCmd(txt); if (!fn && !s) { toast('Commande inconnue. Exemples : SNTS (menu du titre) · SNTS FA · QQQ BTST · FG · TOP'); return; }
  if (fn && FN[fn][1] === 'mkt') { go(fn, s); return; }
  go(fn || 'MENU', s || ST.sec);
}
function menuItems(s) { return MENU_GROUPS.flatMap(g => g[1]); }
/* Saisie façon Bloomberg : « SNTS » propose les titres ; « SNTS » + espace (ou Tab) propose les fonctions du titre. */
function exactSec(t) { const u = (t || '').toUpperCase(); return Q.by[u] || Q.sum.secs.find(s => s.tk.toUpperCase().split(' ')[0] === u) || null; }
function initCmd() {
  const inp = $('cmd'), ac = $('ac'); let sel = 0, items = [];
  const show = () => {
    const v = inp.value, toks = v.trim().split(/\s+/).filter(Boolean), sp = /\s$/.test(v); const S = toks.length ? exactSec(toks[0]) : null;
    if (S && (toks.length > 1 || sp)) {
      const part = (toks.length > 1 ? toks[toks.length - 1] : '').toUpperCase();
      items = menuItems(S).concat(['CORR']).filter(c => !part || c.startsWith(part) || FN[c][0].toUpperCase().includes(part))
        .map(c => { const why = avail(c, S); return { k: 'sfn', id: c, sec: S.id, a: `${S.id} ${c}`, b: FN[c][0] + ' — ' + FN[c][3], c: why ? 'n.d.' : FN[c][2], off: !!why }; });
    } else {
      const last = toks[toks.length - 1] || '', L = last.toUpperCase();
      const fns = Object.keys(FN).filter(k => k !== 'MENU' && L && (k.startsWith(L) || FN[k][0].toUpperCase().startsWith(L)))
        .map(k => ({ k: 'fn', id: k, a: k, b: FN[k][0] + ' — ' + FN[k][3], c: FN[k][1] === 'sec' ? 'TITRE' : 'FONCTION' }));
      const ss = searchSecs(last).slice(0, 12).map(s => ({ k: 'sec', id: s.id, a: s.tk, b: s.n, c: s.cls === 'Equity' ? (s.mkt === 'BRVM' ? 'BRVM' : s.typ) : s.cls }));
      items = (ss.length && ss[0].id.toUpperCase() === L ? ss.concat(fns) : fns.concat(ss)).slice(0, 16);
    }
    sel = Math.max(0, items.findIndex(it => !it.off)); ac.hidden = !items.length;
    ac.innerHTML = items.map((it, i) => `<div class="${i === sel ? 'on' : ''}${it.off ? ' off' : ''}" data-i="${i}"><b>${esc(it.a)}</b><span>${esc(it.b)}</span><span>${it.c}</span></div>`).join('') +
      (items.length && items[0].k !== 'sfn' && items.some(it => it.k === 'sec') ? '<p class="hint">Entrée : menu du titre · Tab : ses fonctions</p>' : '');
  };
  const pick = (i, tab) => { const it = items[i]; if (!it) return;
    if (it.k === 'sec' && tab) { inp.value = it.id + ' '; show(); return; }
    ac.hidden = true; inp.value = ''; inp.blur();
    if (it.k === 'sfn') go(it.id, it.sec); else if (it.k === 'fn') go(it.id, ST.sec); else go('MENU', it.id); };
  inp.addEventListener('input', show); inp.addEventListener('focus', () => { if (inp.value) show(); });
  inp.addEventListener('keydown', e => { if (ac.hidden) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; [...ac.querySelectorAll('div')].forEach((c, i) => c.classList.toggle('on', i === sel)); c0(); }
    if (e.key === 'Tab') { e.preventDefault(); pick(sel, true); } if (e.key === 'Escape') { ac.hidden = true; } });
  const c0 = () => { const d = ac.querySelector('div.on'); if (d) d.scrollIntoView({ block: 'nearest' }); };
  ac.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
  $('cmdForm').addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim();
    if (!ac.hidden && items.length && !/^\d{1,2}$/.test(v)) { const exactFn = v.toUpperCase().split(/\s+/); const typedFn = exactFn.length === 1 && FN[exactFn[0]];
      if (!typedFn || items[sel].a === exactFn[0]) { pick(sel); return; } }
    ac.hidden = true; inp.value = ''; inp.blur(); runCmd(v); });
  inp.addEventListener('blur', () => setTimeout(() => { ac.hidden = true; }, 150));
  document.addEventListener('keydown', e => { if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return; if (/^[a-zA-Z0-9]$/.test(e.key)) { inp.focus(); } if (e.key === 'Escape') go('MON'); });
}

/* ---------- router ---------- */
let renderSeq = 0;
function go(fn, s) { if (fn && FN[fn]) ST.fn = fn; if (s && Q.by[s]) ST.sec = s; try { history.replaceState(null, '', '#' + ST.fn + (SECFN.has(ST.fn) ? '~' + ST.sec : '')); } catch (e) { } render(); window.scrollTo(0, 0); }
function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); if (!h) return; const [f, s] = h.split('~'); if (FN[f]) ST.fn = f; if (s && Q.by[s]) ST.sec = s; }
async function render() {
  const seq = ++renderSeq; untip(); renderKeys(); renderSecbar(); renderStatus();
  const m = $('main'); m.innerHTML = '<div class="empty">Chargement…</div>';
  const why = SECFN.has(ST.fn) && ST.fn !== 'MENU' ? avail(ST.fn, sec(ST.sec)) : null;
  if (why) { m.innerHTML = `<div class="pn"><div class="pt">${sec(ST.sec).tk} · ${FN[ST.fn][0]}<span class="code">${ST.fn}</span></div><div class="pb"><div class="empty">Non disponible pour ce titre : ${esc(why)}.<br><br><button class="tb" data-fn="MENU">Voir les fonctions disponibles</button></div></div></div>`; return; }
  if (!PAGES[ST.fn]) { m.innerHTML = '<div class="empty">Fonction en préparation.</div>'; return; }
  try { await PAGES[ST.fn](m, () => seq === renderSeq); }
  catch (e) { console.error(e); if (seq === renderSeq) m.innerHTML = `<div class="empty">Impossible d'afficher cette fonction : ${esc(e.message)}</div>`; }
}
function renderKeys() { $('fkeys').innerHTML = MKT_KEYS.map((k, i) => `<button class="fk ${ST.fn === k ? 'on' : ''}" data-fn="${k}" title="${esc(FN[k][3])}"><em>${i + 1})</em><b>${k}</b>${FN[k][0]}</button>`).join(''); }
function renderSecbar() {
  const b = $('secbar'); if (!SECFN.has(ST.fn)) { b.hidden = true; $('stabs').hidden = true; return; } b.hidden = false; const s = sec(ST.sec);
  b.innerHTML = `<span class="tk">${s.tk}<small>${s.cls === 'Equity' ? 'Equity' : s.cls}</small></span><span class="nm">${esc(s.n)}</span>
    <span class="px">${px(s, s.last)}</span><span class="kv">${s.ccy}</span><span>${sgn(s.last - s.prev, pxd(s), '', 1)} ${pc(s.pct)}</span>
    <span class="kv">Date<b>${fd(s.dt)}${s.live ? ' · séance' : ''}</b></span>
    ${s.shd != null ? `<span class="kv">Vol<b>${num(s.shd, 0)}</b></span>` : ''}
    <span class="kv">52 sem.<b>${px(s, s.lo52)} – ${px(s, s.hi52)}</b></span><span class="kv">YTD<b>${pc(s.ytd, 1)}</b></span><span class="kv">1 an<b>${pc(s.r1y, 1)}</b></span>
    ${s.mcap ? `<span class="kv">Capi<b>${big(s.mcap)} XOF</b></span>` : ''}${s.per ? `<span class="kv">PER<b>${num(s.per, 1)}</b></span>` : ''}${s.yld ? `<span class="kv">Rdt<b>${num(s.yld * 100, 2)}%</b></span>` : ''}
    <span class="kv">${s.grp ? esc(s.grp) : ''}${s.cty ? ' · ' + esc(Q.sum.cty[s.cty] || s.cty) : ''}</span>`;
  const t = $('stabs'); t.hidden = false;
  t.innerHTML = `<button class="st ${ST.fn === 'MENU' ? 'on' : ''}" data-fn="MENU">MENU</button>` + SEC_TABS.map(k => { const why = avail(k, s); return `<button class="st ${ST.fn === k ? 'on' : ''}${why ? ' off' : ''}" data-fn="${k}" title="${esc(FN[k][0] + (why ? ' — ' + why : ''))}">${k}<small>${FN[k][0]}</small></button>`; }).join('');
}
function renderStatus() {
  const L = Q.live && Q.live.qqq, ss = Q.sum.session;
  $('status').innerHTML = `<span>Données au <b>${fd(Q.sum.asof)}</b> · ${Q.sum.secs.length} titres · séance BRVM <b>${ss ? fds(ss.asof) : '—'}</b>${L ? ` · QQQ <b>${num(L.price, 2)}</b> (${L.state === 'REGULAR' ? 'séance' : L.state === 'CLOSED' ? 'clôturé' : L.state}, ${new Date(L.time * 1000).toISOString().slice(11, 16)} UTC)` : ''}</span>
    <span>Ticker + <b>Entrée</b> : menu du titre · ticker + <b>espace</b> : ses fonctions · graphiques : trackpad / molette, double-clic = vue initiale</span>
    <span>Sources : brvm.org · BRVMetrics · SikaFinance · Nasdaq · Yahoo Finance · SEC · FRED · CBOE · CNN · Coinbase · Banque mondiale · datasets.io — outil d'analyse, pas un conseil en investissement</span>`;
}
function clocks() { const z = [['ABJ', 'Africa/Abidjan'], ['PAR', 'Europe/Paris'], ['NY', 'America/New_York'], ['TPE', 'Asia/Taipei']];
  const t = () => { $('clocks').innerHTML = z.map(([k, tz]) => `<span>${k} <b>${new Date().toLocaleTimeString('fr-FR', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: k === 'ABJ' ? '2-digit' : undefined })}</b></span>`).join(''); };
  t(); setInterval(t, 1000); }
function feedState() { const L = Q.live && Q.live.qqq, f = $('feed'); const age = Q.live ? Date.now() / 1000 - (Q.live.ts || 0) : 1e9;
  const live = L && L.state === 'REGULAR' && age < 40 * 60; f.classList.toggle('live', !!live);
  $('feedTxt').textContent = live ? 'FLUX 15 MIN' : Q.live ? 'MAJ ' + new Date(Q.live.ts * 1000).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'EOD ' + fd(Q.sum.asof); }
function toast(msg, ms = 6000) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ms); }

/* ---------- live feed (artifact db written by the sync task) + polling (static hosting) ---------- */
async function initFeed() {
  if (!window.claude || !window.claude.use) { setInterval(pollStatic, 5 * 60 * 1000); return; }
  let db = null; try { db = await window.claude.use('db'); } catch (e) { } if (!db) return;
  const apply = () => { applyQuotes(); for (const p of Object.values(Q.ser)) p.then(applyQuoteToSeries); Q.M = {}; feedState(); renderSecbar(); renderStatus(); if (['MON', 'BRVM', 'IMAP', 'US'].includes(ST.fn)) render(); };
  try { db.doc('feed/live').onSnapshot(sn => { if (sn.exists) { const d = sn.data(); if (!Q.live || (d.ts || 0) >= (Q.live.ts || 0)) { Q.live = d; apply(); } } }, () => { }); } catch (e) { }
  try { db.doc('feed/quotes').onSnapshot(sn => { if (sn.exists) { const d = sn.data(); if (!Q.quotes || (d.ts || 0) >= (Q.quotes.ts || 0)) { Q.quotes = d; apply(); } } }, () => { }); } catch (e) { }
  try { db.doc('feed/news').onSnapshot(async sn => { if (!sn.exists) return; const d = sn.data(); const cur = await (Q.json['news.json'] || Promise.resolve(null)).catch(() => null);
    if (!cur || (d.ts || 0) > (cur.ts || 0)) { Q.json['news.json'] = Promise.resolve(d); if (['TOP', 'CN'].includes(ST.fn)) render(); } }, () => { }); } catch (e) { }
}
async function pollStatic() { try { const [l, q] = await Promise.all([fetch(Q.base + 'live.json?t=' + Date.now()).then(r => r.ok ? r.json() : null), fetch(Q.base + 'quotes.json?t=' + Date.now()).then(r => r.ok ? r.json() : null)]);
  if (l) Q.live = l; if (q) { Q.quotes = q; applyQuotes(); Q.ser = {}; Q.M = {}; } delete Q.json['news.json']; feedState(); renderSecbar(); renderStatus(); if (['MON', 'BRVM', 'IMAP', 'US', 'TOP'].includes(ST.fn)) render(); } catch (e) { } }
async function initSync() {
  if (!/^trig_/.test(TRIGGER_ID) || !window.claude || !window.claude.use) return; let mcp = null; try { mcp = await window.claude.use('mcp'); } catch (e) { } if (!mcp) return;
  const b = $('syncBtn'); b.hidden = false;
  b.addEventListener('click', async () => { b.disabled = true; b.textContent = '…';
    try { await mcp.callTool('Claude Code Remote', 'fire_trigger', { trigger_id: TRIGGER_ID }, { cache: false }); toast('Synchronisation lancée : le dernier relevé arrive dans 2 à 4 minutes, sans recharger la page.', 9000); b.textContent = 'OK'; }
    catch (e) { const c = e && e.code; b.textContent = 'SYNC'; toast(c === 'rate_limited' ? 'Trop de demandes rapprochées : réessaie dans quelques minutes.' : c === 'not_granted' || c === 'consent_required' ? 'Autorisation refusée : ouvre le menu Autorisations de la page.' : 'La synchro n’a pas pu être lancée (' + (c || 'erreur') + '). La mise à jour planifiée tourne quand même.', 9000); }
    finally { setTimeout(() => { b.disabled = false; b.textContent = 'SYNC'; }, 60000); } });
}

/* ---------- boot ---------- */
async function boot() {
  readCL(); renderKeysSkeleton();
  try { Q.sum = await getJSON('summary.json'); } catch (e) { $('main').innerHTML = `<div class="empty">Données introuvables (data/summary.json).</div>`; return; }
  for (const s of Q.sum.secs) Q.by[s.id] = s;
  try { Q.live = await getJSON('live.json'); } catch (e) { } try { Q.quotes = await getJSON('quotes.json'); applyQuotes(); } catch (e) { }
  fromHash(); initCmd(); clocks(); feedState();
  document.addEventListener('click', e => { const f = e.target.closest('[data-fn]'); if (f) { go(f.dataset.fn, f.dataset.s); return; }
    const s = e.target.closest('[data-sec]'); if (s && !e.target.closest('a')) { const id = s.dataset.sec; go(s.dataset.to || (SECFN.has(ST.fn) && ST.fn !== 'MENU' && !avail(ST.fn, sec(id)) ? ST.fn : 'MENU'), id); } });
  render(); initFeed(); initSync();
}
function renderKeysSkeleton() { $('fkeys').innerHTML = MKT_KEYS.map((k, i) => `<button class="fk" data-fn="${k}"><em>${i + 1})</em><b>${k}</b>${FN[k][0]}</button>`).join(''); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body></html>
